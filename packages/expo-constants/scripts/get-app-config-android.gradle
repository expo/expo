import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations
import org.gradle.work.DisableCachingByDefault
import javax.inject.Inject

@DisableCachingByDefault(because = 'App config can read files and environment values not tracked by Gradle.')
abstract class CreateExpoConfig extends DefaultTask {
  @Inject abstract ExecOperations getExecOperations()
  @Input abstract Property<String> getProjectRoot()
  @Input abstract ListProperty<String> getNodeExecutableAndArgs()
  @Input abstract Property<String> getConfigMode()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getConfigScript()
  @OutputDirectory abstract DirectoryProperty getAssetDir()

  CreateExpoConfig() {
    outputs.upToDateWhen { false }
  }

  @TaskAction
  void generate() {
    def output = assetDir.get().asFile
    output.mkdirs()
    def args = nodeExecutableAndArgs.get() + [configScript.get().asFile.absolutePath, projectRoot.get(), output.absolutePath, 'android', 'false', configMode.get()]
    execOperations.exec {
      workingDir projectRoot.get()
      commandLine Os.isFamily(Os.FAMILY_WINDOWS) ? ['cmd', '/c'] + args : args
    }
  }
}

def expoConstantsDir = project.providers.exec {
  workingDir(projectDir)
  commandLine("node", "-e", "console.log(require('path').dirname(require.resolve('expo-constants/package.json')));")
}.standardOutput.asText.get().trim()

def config = project.hasProperty("react") ? project.react : [];
def nodeExecutableAndArgs = config.nodeExecutableAndArgs ?: ["node"]

pluginManager.withPlugin('com.android.library') {
  def android = extensions.getByName('android')
  def androidComponents = extensions.getByName('androidComponents')
  def script = new File(projectDir, '../scripts/getAppConfig.js')
  androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def expoGradleExtension = gradle.extensions.findByName('expoGradle')
    def configRoot = expoGradleExtension?.projectRoot ?: rootProject.projectDir
    def nativeDevelopment = android.buildTypes.getByName(variant.buildType).debuggable
    def task = tasks.register("create${variant.name.capitalize()}ExpoConfig", CreateExpoConfig) {
      description = "expo-constants: Create app.config for ${variant.name}."
      projectRoot.set(configRoot.absolutePath)
      it.nodeExecutableAndArgs.set(nodeExecutableAndArgs)
      configScript.set(script)
      configMode.set(nativeDevelopment ? 'development' : 'production')
      assetDir.set(layout.buildDirectory.dir("generated/assets/expo-constants/${variant.name}"))
    }
    variant.sources.assets.addGeneratedSourceDirectory(task) { it.assetDir }
  }
}

afterEvaluate {
  def expoGradleExtension = gradle.extensions.findByName("expoGradle")
  def customProjectRoot = expoGradleExtension?.projectRoot
  def projectRoot = file("${customProjectRoot ?: rootProject.projectDir}")

  def fingerprintAssetsDir = file("$buildDir/generated/assets/expo-constants-fingerprint")

  def createFingerprintTask = tasks.register('createExpoFingerprint', Exec) {
    description = 'expo-constants: Embed the project fingerprint (app.fingerprint) in debug builds.'

    doFirst {
      fingerprintAssetsDir.deleteDir()
      fingerprintAssetsDir.mkdirs()
    }

    // The fingerprint hashes sources across the whole project, so always regenerate it
    outputs.upToDateWhen { false }
    outputs.dir fingerprintAssetsDir

    workingDir projectRoot

    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
      commandLine("cmd", "/c", *nodeExecutableAndArgs, "$expoConstantsDir/scripts/createFingerprintFile.js", projectRoot, fingerprintAssetsDir, "android")
    } else {
      commandLine(*nodeExecutableAndArgs, "$expoConstantsDir/scripts/createFingerprintFile.js", projectRoot, fingerprintAssetsDir, "android")
    }
  }

  project.android.libraryVariants.all { variant ->
    if (!variant.buildType.debuggable) {
      return
    }
    variant.preBuildProvider.configure { it.dependsOn(createFingerprintTask) }
    project.android.sourceSets.maybeCreate(variant.buildType.name).assets.srcDirs += fingerprintAssetsDir
  }
}
