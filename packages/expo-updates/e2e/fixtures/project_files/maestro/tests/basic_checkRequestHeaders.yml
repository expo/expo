appId: dev.expo.updatese2e
onFlowStart:
  - runFlow:
      file: beforeEach.yml
---
# initial request includes correct update-id headers
- launchApp
- copyTextFrom:
    label: Copy text from update string
    id: updateString
- assertTrue:
    condition: ${maestro.copiedText == "test"}
    label: Assert update string is from embedded bundle
- evalScript:
    script: ${output.headers = output.api.waitForUpdateRequest(15000)}
    label: Wait for initial update request headers
- assertTrue:
    condition: ${output.headers.host == 'localhost:' + MAESTRO_UPDATES_SERVER_PORT}
    label: Check that request contains correct host header
    env:
      MAESTRO_UPDATES_SERVER_PORT: ${MAESTRO_UPDATES_SERVER_PORT}
- assertTrue:
    condition: ${output.headers['expo-channel-name'] == 'default'}
    label: Check that request contains correct channel name header
- assertTrue:
    condition: ${output.headers['expo-runtime-version'] == '1.0.0'}
    label: Check that request contains correct runtime version header
- stopApp
