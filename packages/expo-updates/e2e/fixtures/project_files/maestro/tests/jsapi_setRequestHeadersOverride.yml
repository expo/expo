appId: dev.expo.updatese2e
onFlowStart:
  - runFlow:
      file: beforeEach.yml
---
- launchApp
- evalScript:
    script: ${output.api.waitForUpdateRequest(15000)}
    label: Wait for initial startup update request
- extendedWaitUntil:
    visible:
      id: state.isStartupProcedureRunning
      text: "false"
    timeout: 30000
- copyTextFrom:
    label: Copy text from update string
    id: updateString
- assertTrue:
    condition: ${maestro.copiedText == 'test'}
    label: Assert update string is from embedded bundle
- copyTextFrom:
    label: Copy text from ('channel')
    id: channel
- assertTrue:
    condition: ${maestro.copiedText == 'default'}
    label: Assert channel is default

# Send update to preview channel and verify new update
- evalScript:
    script: ${output.downloadedUpdateId = output.api.serveManifest('test-update-basic', MAESTRO_PLATFORM, 'preview')}
    label: Send new update to preview channel
    env:
      MAESTRO_PLATFORM: ${MAESTRO_PLATFORM}
- tapOn:
    label: Tap on check for update button
    id: checkForUpdate
- evalScript:
    script: ${output.api.waitForUpdateRequest(15000)}
    label: Wait for checkForUpdate request on default channel
- extendedWaitUntil:
    notVisible:
      id: activity
    timeout: 15000
- copyTextFrom:
    label: Copy text from availableUpdateID
    id: availableUpdateID
- assertTrue:
    condition: ${maestro.copiedText == 'undefined'}
    label: Assert no update is available
- tapOn:
    label: Tap on toggleUpdateRequestHeadersOverride button
    id: toggleUpdateRequestHeadersOverride
- extendedWaitUntil:
    notVisible:
      id: activity
    timeout: 15000
- tapOn:
    label: Tap on check for update button
    id: checkForUpdate
- extendedWaitUntil:
    visible:
      id: availableUpdateID
      text: ${output.downloadedUpdateId}
    timeout: 15000
- copyTextFrom:
    label: Copy text from availableUpdateID
    id: availableUpdateID
- assertTrue:
    condition: ${maestro.copiedText == output.downloadedUpdateId}
    label: Assert correct update ID is available
- tapOn:
    label: Tap on download update button
    id: downloadUpdate
- extendedWaitUntil:
    visible:
      id: state.downloadedManifest.id
      text: ${output.downloadedUpdateId}
    timeout: 30000
- tapOn: "reload"
- extendedWaitUntil:
    visible:
      id: updateID
      text: ${output.downloadedUpdateId}
    timeout: 30000
- copyTextFrom:
    label: Copy text from update channel
    id: channel
- assertTrue:
    condition: ${maestro.copiedText == 'preview'}
    label: Assert update channel is the preview channel
- copyTextFrom:
    label: Copy text from update string
    id: updateID
- assertTrue:
    condition: ${maestro.copiedText == output.downloadedUpdateId}
    label: Assert update string is from downloaded bundle

# Send update to default channel and verify new update from default channel
- evalScript:
    script: ${output.api.restartUpdatesServer()}
    label: Reset updates server before default channel check
- evalScript:
    script: ${output.downloadedUpdateId = output.api.serveManifest('test-update-basic', MAESTRO_PLATFORM, 'default')}
    label: Send new update to default channel
    env:
      MAESTRO_PLATFORM: ${MAESTRO_PLATFORM}
- tapOn:
    label: Tap on check for update button
    id: checkForUpdate
- evalScript:
    script: ${output.api.waitForUpdateRequest(15000)}
    label: Wait for checkForUpdate request on preview channel
- extendedWaitUntil:
    notVisible:
      id: activity
    timeout: 15000
- copyTextFrom:
    label: Copy text from availableUpdateID
    id: availableUpdateID
- assertTrue:
    condition: ${maestro.copiedText == 'undefined'}
    label: Assert no update is available
- tapOn:
    label: Tap on toggleUpdateRequestHeadersOverride button to reset channel
    id: toggleUpdateRequestHeadersOverride
- extendedWaitUntil:
    notVisible:
      id: activity
    timeout: 15000
- tapOn:
    label: Tap on check for update button
    id: checkForUpdate
- extendedWaitUntil:
    visible:
      id: availableUpdateID
      text: ${output.downloadedUpdateId}
    timeout: 15000
- copyTextFrom:
    label: Copy text from availableUpdateID
    id: availableUpdateID
- assertTrue:
    condition: ${maestro.copiedText == output.downloadedUpdateId}
    label: Assert correct update ID is available
- tapOn:
    label: Tap on download update button
    id: downloadUpdate
- extendedWaitUntil:
    visible:
      id: state.downloadedManifest.id
      text: ${output.downloadedUpdateId}
    timeout: 30000
- tapOn: "reload"
- extendedWaitUntil:
    visible:
      id: updateID
      text: ${output.downloadedUpdateId}
    timeout: 30000
- copyTextFrom:
    label: Copy text from update channel
    id: channel
- assertTrue:
    condition: ${maestro.copiedText == 'default'}
    label: Assert update channel reset to default
- copyTextFrom:
    label: Copy text from update string
    id: updateID
- assertTrue:
    condition: ${maestro.copiedText == output.downloadedUpdateId}
    label: Assert update string is from downloaded bundle
- stopApp
