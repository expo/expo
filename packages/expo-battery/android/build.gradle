plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '58.0.3'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.battery"
  defaultConfig {
    versionCode 11
    versionName '58.0.3'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
