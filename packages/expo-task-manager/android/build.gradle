plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '58.0.12'

android {
  namespace "expo.modules.taskmanager"
  defaultConfig {
    versionCode 23
    versionName "58.0.12"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  def appLoaderProject = findProject(':unimodules-app-loader')
  if (appLoaderProject != null) {
    implementation appLoaderProject
  } else {
    def appLoaderPublication = gradle.expoGradle.config.allProjects
      .find { it.name == 'unimodules-app-loader' }
      .publication
    implementation "${appLoaderPublication.groupId}:${appLoaderPublication.artifactId}:${appLoaderPublication.version}"
  }
  api "androidx.core:core:1.17.0"
  compileOnly "com.facebook.react:react-android"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16'
}
