plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '58.0.4'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.haptics"
  defaultConfig {
    versionCode 16
    versionName '58.0.4'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
