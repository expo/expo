plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '58.0.5'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.device"
  defaultConfig {
    versionCode 12
    versionName '58.0.5'
  }
}

dependencies {
  api 'com.facebook.device.yearclass:yearclass:2.1.0'
}
