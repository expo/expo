buildscript {

  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }

}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'host.exp.exponent'
version = '58.0.10'

android {
  namespace "expo.modules.maps"
  defaultConfig {
    versionCode 1
    versionName "58.0.10"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.compose.foundation:foundation-android:1.9.1'
  implementation 'androidx.compose.ui:ui-android:1.9.1'

  implementation 'com.google.maps.android:maps-compose:6.10.0'
  implementation 'com.google.maps.android:maps-compose-widgets:6.10.0'

  testImplementation 'junit:junit:4.13.2'
}
