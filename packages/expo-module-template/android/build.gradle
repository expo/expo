<% const sdk = typeof compat === 'undefined' ? {} : compat; -%>
<% const moduleVersion = type === 'standalone' || type === 'remote' ? project.version : '0.1.0'; -%>
<% if (usesCompose) { -%>
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

<% } -%>
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
<% if (usesCompose) { -%>
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
<% } -%>

group = '<%- project.package %>'
version = '<%- moduleVersion %>'

android {
  namespace "<%- project.package %>"
  defaultConfig {
    versionCode 1
    versionName "<%- moduleVersion %>"
  }
<% if (usesCompose) { -%>
  buildFeatures {
    compose true
  }
<% } -%>
  lintOptions {
    abortOnError false
  }
}
<% if (usesCompose) { -%>

dependencies {
  implementation 'androidx.compose.foundation:foundation-android:<%- sdk.composeVersions?.foundation ?? '1.10.6' %>'
  implementation 'androidx.compose.ui:ui-android:<%- sdk.composeVersions?.ui ?? '1.10.6' %>'
  implementation 'androidx.compose.material3:material3-android:<%- sdk.composeVersions?.material3 ?? '1.5.0-alpha17' %>'
  if (findProject(':expo-ui') != null) {
    implementation project(':expo-ui')
  } else {
    implementation 'expo.modules.ui:expo.modules.ui:+'
  }
}
<% } -%>
