extends: substitution
message: "Consider using '%s' instead of '%s'"
link: 'https://github.com/expo/expo/blob/main/guides/Expo%20Documentation%20Writing%20Style%20Guide.md#follow-external-product-casing'
level: error
ignorecase: true
scope: ~text.frontmatter
# "[ ]" matches a space only. Since Vale 3.25.1, a plain space in a key also matches a line
# break, and the rule then reports a correct phrase that wraps across two lines.
swap:
  '\b & \b': and
  'amazon[ ]appstore': Amazon Appstore
  'android[ ]emulator': Android Emulator
  'apple[ ]developer': Apple Developer
  cancelation: cancellation
  cancelled: canceled
  cancelling: canceling
  cocoapods: CocoaPods
  devops: DevOps
  eas: EAS
  'eas[ ]cli': EAS CLI
  'expo[ ]build': Expo Build
  'expo[ ]cli': Expo CLI
  'expo[ ]go': Expo Go
  'expo[ ]metadata': Expo Metadata
  'expo[ ]observe': Expo Observe
  'expo[ ]sdk': Expo SDK
  'expo[ ]simulators': Expo Simulators
  'expo[ ]submit': Expo Submit
  'expo[ ]update': Expo Update
  github: GitHub
  Github: GitHub
  gitlab: GitLab
  'ios[ ]simulator': iOS Simulator
  icloud: iCloud
  IPhone: iPhone
  javascript: JavaScript
  'javascript[ ]core': JavaScriptCore
  'mac[ ]os': macOS
  macos: macOS
  MacOS: macOS
  NPM: npm
  nodejs: Node.js
  Nodejs: Node.js
  openjdk: OpenJDK
  'objective[ ]c': Objective-C
  'react[ ]native': React Native
  'react[ ]navigation': React Navigation
  'stack[ ]overflow': Stack Overflow
  storybook: Storybook
  sql: SQL
  'tailwind[ ]css': Tailwind CSS
  tailwindcss: Tailwind CSS
  'transfer[ ]windows': transfer windows
  'turtle[ ]cli': Turtle CLI
  typescript: TypeScript
  unix: Unix
  'vs[ ]code': VS Code
  vscode: VS Code
  VSCode: VS Code
  wifi: Wi-Fi
  wi-fi: Wi-Fi
  windows: Windows
  yarn: Yarn
  youtube: YouTube
