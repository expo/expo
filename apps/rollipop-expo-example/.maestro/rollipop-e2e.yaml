# Real end-to-end test for the rollipop + Expo Router integration on a real
# iOS simulator. The JS bundle is served by `rollipop` (not Metro).
#
# NOTE: on a cold launch the simulator dev client occasionally surfaces a
# transient "[runtime not ready]: NativeModule ... is null" RedBox while native
# modules finish initializing. It is a dev-client race (the bundle does not even
# import the module in question) and is cleared by a reload. The retry block
# below relaunches on failure so a single flaky cold start does not fail the gate.
appId: com.example.app
env:
  BUNDLER_URL: "http://localhost:8081"
---
- retry:
    maxRetries: 3
    commands:
      - launchApp
      # Cold-launch settle: Hermes + bundle eval can take a moment on first run.
      - waitForAnimationToEnd:
          timeout: 15000
      - assertVisible: "Rollipop + Expo Router"
      - tapOn: "Push About"
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible: "About"
      - tapOn: "Go to User 42"
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible: "User 42"
