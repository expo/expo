appId: dev.expo.payments
---
# Start from a fresh screen, so the counts start at 0.
- openLink: bareexpo://components/ui
- openLink: bareexpo://components/ui/rnhostview-in-clickable
- assertVisible: 'view: row 0, inner 0'

# Plain hosted content passes the tap to the parent `clickable`.
- tapOn:
    id: view-hosted
- assertVisible: 'view: row 1, inner 0'
- tapOn:
    id: pointer-events-none-hosted
- assertVisible: 'pointer-events-none: row 1, inner 0'
- tapOn:
    id: text-hosted
- assertVisible: 'text: row 1, inner 0'

# Hosted content that handles the press keeps it.
- tapOn:
    id: pressable-target
- assertVisible: 'pressable: row 0, inner 1'
- tapOn:
    id: text-on-press-target
- assertVisible: 'text-on-press: row 0, inner 1'
- tapOn:
    id: switch-target
- assertVisible: 'switch: row 0, inner 1'
- tapOn:
    id: text-input-target
- hideKeyboard
- assertVisible: 'text-input: row 0, inner 0'
