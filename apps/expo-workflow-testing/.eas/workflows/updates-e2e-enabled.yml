name: Updates E2E (enabled)

defaults:
  tools:
    pnpm: '12.2.1'

on:
  push:
    branches: [main, 'sdk-*']
    paths:
      - apps/expo-workflow-testing/.eas/workflows/updates-e2e-enabled.yml
      - packages/@expo/cli/**
      - packages/@expo/config-plugins/**
      - packages/@expo/env/**
      - packages/@expo/metro-config/**
      - packages/@expo/prebuild-config/**
      - packages/expo/**
      - packages/expo-asset/**
      - packages/expo-font/**
      - packages/expo-json-utils/**
      - packages/expo-manifests/**
      - packages/expo-modules-autolinking/**
      - packages/expo-modules-core/**
      - packages/expo-splash-screen/**
      - packages/expo-structured-headers/**
      - packages/expo-updates-interface/**
      - packages/expo-updates/**
      - templates/expo-template-bare-minimum/**
      - '!**/ios/Tests/**'
      - '!**/ios/WorkletsTests/**'
      - '!**/ios/Benchmarks/**'
      - '!**/apple/Tests/**'
      - '!**/apple/Benchmarks/**'
      - '!**/android/src/test/**'
      - '!**/android/src/androidTest/**'
      - '!**/android/src/testDebug/**'
  pull_request:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'changeset-release/') }}
    paths:
      - apps/expo-workflow-testing/.eas/workflows/updates-e2e-enabled.yml
      - packages/@expo/cli/**
      - packages/@expo/config-plugins/**
      - packages/@expo/env/**
      - packages/@expo/metro-config/**
      - packages/@expo/prebuild-config/**
      - packages/expo/**
      - packages/expo-asset/**
      - packages/expo-font/**
      - packages/expo-json-utils/**
      - packages/expo-manifests/**
      - packages/expo-modules-autolinking/**
      - packages/expo-modules-core/**
      - packages/expo-splash-screen/**
      - packages/expo-structured-headers/**
      - packages/expo-updates-interface/**
      - packages/expo-updates/**
      - templates/expo-template-bare-minimum/**
      - '!**/ios/Tests/**'
      - '!**/ios/WorkletsTests/**'
      - '!**/ios/Benchmarks/**'
      - '!**/apple/Tests/**'
      - '!**/apple/Benchmarks/**'
      - '!**/android/src/test/**'
      - '!**/android/src/androidTest/**'
      - '!**/android/src/testDebug/**'
  schedule:
    - cron: '0 20 * * SUN' # 22:00 UTC every Sunday

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  detect_platform:
    name: Detect platform changes
    runs_on: linux-medium
    image: latest
    outputs:
      should_run_ios: ${{ steps.detect.outputs.should_run_ios }}
      should_run_android: ${{ steps.detect.outputs.should_run_android }}
    steps:
      - uses: eas/checkout
      - id: detect
        outputs: [should_run_ios, should_run_android]
        run: |
          bash scripts/detect-platform-change.sh \
            "${{ github.event_name }}" \
            "${{ github.event.repository.full_name }}" \
            "${{ github.event.pull_request.number }}" \
            '^(apps/expo-workflow-testing/\.eas/workflows/updates-e2e-enabled\.yml|packages/(@expo/(cli|config-plugins|env|metro-config|prebuild-config)|expo|expo-asset|expo-font|expo-json-utils|expo-manifests|expo-modules-autolinking|expo-modules-core|expo-splash-screen|expo-structured-headers|expo-updates-interface|expo-updates)/|templates/expo-template-bare-minimum/)'

  ios:
    needs: [detect_platform]
    if: ${{ needs.detect_platform.outputs.should_run_ios == 'true' }}
    runs_on: macos-large
    image: latest
    # Stop the app when the updates state machine drops an event that is not allowed from its
    # current state, so an invalid transition fails this run instead of passing unnoticed.
    env:
      EAS_USE_CACHE: '1'
      EX_UPDATES_ASSERT_INVALID_STATE: 'true'
    steps:
      - uses: eas/install_maestro
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - uses: eas/restore_build_cache
        with:
          platform: ios
      - name: Set up Updates E2E enabled project
        id: setup
        working_directory: ../..
        env:
          UPDATES_HOST: localhost
          UPDATES_PORT: '4747'
          UPDATES_E2E_PLATFORM: ios
        run: |
          pnpm --silent ts-node ./packages/expo-updates/e2e/setup/create-eas-project.ts
          ls -la ../updates-e2e
      - name: Prepare E2E project
        id: prepare
        working_directory: ../../../updates-e2e
        run: |
          pnpm run generate-test-update-bundles ios
          pnpm run ios:pod-install
      - name: Build E2E test app (debug)
        id: builddebug
        working_directory: ../../../updates-e2e
        run: |
          pnpm run maestro:ios:debug:build
      - name: Build E2E test app (release)
        id: buildrelease
        working_directory: ../../../updates-e2e
        run: |
          pnpm run maestro:ios:release:build
      - uses: eas/save_build_cache
        with:
          platform: ios
      - uses: eas/start_ios_simulator
        with:
          device_identifier: iPhone 17
      - name: Run Maestro tests (debug)
        id: testdebug
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/maestro-test-executor.sh ./maestro/tests/updates-e2e-enabled.yml ios debug
      - name: Run Maestro tests (release)
        id: testrelease
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/maestro-test-executor.sh ./maestro/tests/updates-e2e-enabled.yml ios release
  android:
    needs: [detect_platform]
    if: ${{ needs.detect_platform.outputs.should_run_android == 'true' }}
    runs_on: linux-large-nested-virtualization
    image: latest
    env:
      EX_UPDATES_ASSERT_INVALID_STATE: 'true'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=4096m"'
    steps:
      - uses: eas/install_maestro
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Set up Updates E2E enabled project
        id: setup
        working_directory: ../..
        env:
          UPDATES_HOST: localhost
          UPDATES_PORT: '4747'
          UPDATES_E2E_PLATFORM: android
        run: |
          pnpm --silent ts-node ./packages/expo-updates/e2e/setup/create-eas-project.ts
          ls -la ../updates-e2e
      - name: Prepare E2E project
        id: prepare
        working_directory: ../../../updates-e2e
        run: |
          pnpm run generate-test-update-bundles android
      - name: Build E2E test app (debug and release)
        id: build
        working_directory: ../../../updates-e2e
        run: |
          cd android && ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: eas/start_android_emulator
        with:
          device_name: pixel_9
      # A recording is the only way to see what the app did when a CI failure does not reproduce
      # locally. Each stop step runs even after its test step failed, which is when the video
      # matters most.
      - name: Start screen recording (release)
        id: recordrelease
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/android-screen-recording.sh start
      - name: Run Maestro tests (release)
        id: testrelease
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/maestro-test-executor.sh ./maestro/tests/updates-e2e-enabled.yml android release
      - name: Stop screen recording (release)
        id: stoprecordrelease
        if: ${{ always() }}
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/android-screen-recording.sh stop android-release
      - name: Start screen recording (debug)
        id: recorddebug
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/android-screen-recording.sh start
      - name: Run Maestro tests (debug)
        id: testdebug
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/maestro-test-executor.sh ./maestro/tests/updates-e2e-enabled.yml android debug
      - name: Stop screen recording (debug)
        id: stoprecorddebug
        if: ${{ always() }}
        working_directory: ../../../updates-e2e
        run: |
          ./maestro/android-screen-recording.sh stop android-debug
      - name: Upload screen recordings
        id: uploadrecordings
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: android-screen-recordings
          path: |
            ${{ env.HOME }}/screen-recordings/*.mp4
