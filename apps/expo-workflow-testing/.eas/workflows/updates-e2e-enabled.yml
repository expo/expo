name: Updates E2E (enabled)

defaults:
  tools:
    pnpm: '12.2.1'

on:
  push:
    branches: [main, 'sdk-*']
    paths:
      - apps/expo-workflow-testing/.eas/workflows/updates-e2e-enabled.yml
      - packages/@expo/cli/**
      - packages/@expo/config-plugins/**
      - packages/@expo/env/**
      - packages/@expo/metro-config/**
      - packages/@expo/prebuild-config/**
      - packages/expo/**
      - packages/expo-asset/**
      - packages/expo-font/**
      - packages/expo-json-utils/**
      - packages/expo-manifests/**
      - packages/expo-modules-autolinking/**
      - packages/expo-modules-core/**
      - packages/expo-splash-screen/**
      - packages/expo-structured-headers/**
      - packages/expo-updates-interface/**
      - packages/expo-updates/**
      - templates/expo-template-bare-minimum/**
      - '!**/ios/Tests/**'
      - '!**/ios/WorkletsTests/**'
      - '!**/ios/Benchmarks/**'
      - '!**/apple/Tests/**'
      - '!**/apple/Benchmarks/**'
      - '!**/android/src/test/**'
      - '!**/android/src/androidTest/**'
      - '!**/android/src/testDebug/**'
  pull_request:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'changeset-release/') }}
    paths:
      - apps/expo-workflow-testing/.eas/workflows/updates-e2e-enabled.yml
      - packages/@expo/cli/**
      - packages/@expo/config-plugins/**
      - packages/@expo/env/**
      - packages/@expo/metro-config/**
      - packages/@expo/prebuild-config/**
      - packages/expo/**
      - packages/expo-asset/**
      - packages/expo-font/**
      - packages/expo-json-utils/**
      - packages/expo-manifests/**
      - packages/expo-modules-autolinking/**
      - packages/expo-modules-core/**
      - packages/expo-splash-screen/**
      - packages/expo-structured-headers/**
      - packages/expo-updates-interface/**
      - packages/expo-updates/**
      - templates/expo-template-bare-minimum/**
      - '!**/ios/Tests/**'
      - '!**/ios/WorkletsTests/**'
      - '!**/ios/Benchmarks/**'
      - '!**/apple/Tests/**'
      - '!**/apple/Benchmarks/**'
      - '!**/android/src/test/**'
      - '!**/android/src/androidTest/**'
      - '!**/android/src/testDebug/**'
  schedule:
    - cron: '0 20 * * SUN' # 22:00 UTC every Sunday

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  ios:
    runs_on: macos-large
    image: latest
    # Stop the app when the updates state machine drops an event that is not allowed from its
    # current state, so an invalid transition fails this run instead of passing unnoticed.
    env:
      EX_UPDATES_ASSERT_INVALID_STATE: 'true'
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Set up Updates E2E enabled project
        id: setup
        working_directory: ../..
        env:
          UPDATES_HOST: localhost
          UPDATES_PORT: '4747'
        run: |
          pnpm --silent ts-node ./packages/expo-updates/e2e/setup/create-eas-project.ts
          ls -la ../updates-e2e
      - name: Prepare E2E project
        id: prepare
        working_directory: ../../../updates-e2e
        run: |
          pnpm run generate-test-update-bundles ios
          pnpm run ios:pod-install
      - name: Build E2E test app (debug)
        id: builddebug
        working_directory: ../../../updates-e2e
        run: |
          pnpm run maestro:ios:debug:build
      - name: Build E2E test app (release)
        id: buildrelease
        working_directory: ../../../updates-e2e
        run: |
          pnpm run maestro:ios:release:build
      - name: Run tests in Expo Simulators (debug)
        id: testdebug
        working_directory: ../../../updates-e2e
        run: |
          ./simulator/simulator-test-executor.sh ./simulator/tests/updates-e2e-enabled.txt ios debug
      - name: Run tests in Expo Simulators (release)
        id: testrelease
        working_directory: ../../../updates-e2e
        run: |
          ./simulator/simulator-test-executor.sh ./simulator/tests/updates-e2e-enabled.txt ios release
  android:
    runs_on: linux-large-nested-virtualization
    image: latest
    env:
      EX_UPDATES_ASSERT_INVALID_STATE: 'true'
    steps:
      - uses: eas/checkout
      - uses: eas/use_npm_token
      - uses: eas/install_node_modules
      - name: Set up Updates E2E enabled project
        id: setup
        working_directory: ../..
        env:
          UPDATES_HOST: localhost
          UPDATES_PORT: '4747'
        run: |
          pnpm --silent ts-node ./packages/expo-updates/e2e/setup/create-eas-project.ts
          ls -la ../updates-e2e
      - name: Prepare E2E project
        id: prepare
        working_directory: ../../../updates-e2e
        run: |
          pnpm run generate-test-update-bundles android
      - name: Build E2E test app (debug)
        id: builddebug
        working_directory: ../../../updates-e2e
        run: |
          pnpm run maestro:android:debug:build
      - name: Build E2E test app (release)
        id: buildrelease
        working_directory: ../../../updates-e2e
        run: |
          pnpm run maestro:android:release:build
      - name: Run tests in Expo Simulators (release)
        id: testrelease
        working_directory: ../../../updates-e2e
        run: |
          ./simulator/simulator-test-executor.sh ./simulator/tests/updates-e2e-enabled.txt android release
      - name: Run tests in Expo Simulators (debug)
        id: testdebug
        working_directory: ../../../updates-e2e
        run: |
          ./simulator/simulator-test-executor.sh ./simulator/tests/updates-e2e-enabled.txt android debug
