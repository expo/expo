// Top-level build file where you can add configuration options common to all sub-projects/modules.
import com.android.build.api.variant.AndroidComponentsExtension

buildscript {
  ext {
    minSdkVersion = 24
    targetSdkVersion = 36
    compileSdkVersion = 37

    dbFlowVersion = '4.2.4'
    buildToolsVersion = '37.0.0'
    kotlinVersion = "2.2.21"
    kspVersion = "2.3.10"
    gradleDownloadTaskVersion = '5.0.1'
    repositoryUrl = "file:${System.env.HOME}/.m2/repository/"

    ndkVersion = "27.1.12297006"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath expoLibs.android.gradle.plugin
    classpath 'com.google.gms:google-services:4.4.2'
    classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    classpath "de.undercouch:gradle-download-task:$gradleDownloadTaskVersion"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

    classpath "com.facebook.react:react-native-gradle-plugin"
  }
}

plugins {
   alias libs.plugins.android.application apply false
   alias libs.plugins.android.library apply false
   alias libs.plugins.kotlin.android apply false
   alias libs.plugins.download apply false
}

def reactProperties = new Properties()
file("${project(':packages:react-native:ReactAndroid').projectDir}/gradle.properties").withInputStream { reactProperties.load(it) }

allprojects {
  repositories {
    // For non-detach
    maven {
      url "$rootDir/maven"
    }
    // For old expoviews to work
    maven {
      url "$rootDir/versioned-abis/maven"
    }
    google()
    mavenCentral {
      // We don't want to fetch react-native from Maven Central as there are
      // older versions over there.
      content {
        excludeGroup "com.facebook.react"
      }
    }
    maven {
      // Local Maven repo containing AARs with JSC built for Android
      url "$rootDir/../../../node_modules/jsc-android/dist"
    }
    maven {
      // Local expo-camera Maven repo containing our slightly modified
      // Google's cameraview from expo/cameraview.
      url "$rootDir/../../../packages/expo-camera/android/maven"
    }
    flatDir {
      dirs 'libs'
      // dirs project(':expoview').file('libs')
    }
    maven { url "https://jitpack.io" }

    // Want this last so that we never end up with a stale cache
    mavenLocal()
  }

  configurations.all {
    resolutionStrategy.force(
      libs.fresco,
      libs.fresco.imagepipeline.okhttp3,
      libs.fresco.ui.common
    )
  }
}

project(":packages:react-native:ReactAndroid").afterEvaluate { reactAndroid ->
  // react-native 0.87 no longer registers buildCodegenCLI; keep disabling it while the
  // fork is on an older release. `matching` tolerates the task being absent.
  reactAndroid.tasks.matching { it.name == "buildCodegenCLI" }.configureEach { it.enabled = false }
}

// Expo Go ships a release build that keeps the JS debugger. React Native gates those native defines
// behind REACT_NATIVE_DEBUG_OPTIMIZED, and its CMake guard only passes automatically when
// CMAKE_BUILD_TYPE is Debug. Release maps to RelWithDebInfo, which does not match, so set the flag
// for every variant. Debug builds already satisfy the guard, so this only changes release.
def reactAndroidProject = project(":packages:react-native:ReactAndroid")
reactAndroidProject.plugins.withId("com.android.library") {
  reactAndroidProject.android.defaultConfig.externalNativeBuild.cmake.arguments.add(
    "-DREACT_NATIVE_DEBUG_OPTIMIZED=True"
  )
}

// Hermes itself also has to keep its debugger in release, which React Native turns off explicitly
// rather than behind a guard. This runs after the hermes-engine build script so the value it sets can
// be swapped, and before AGP reads the arguments to create variants.
project(":packages:react-native:ReactAndroid:hermes-engine").afterEvaluate { hermesEngine ->
  def releaseCmake = hermesEngine.android.buildTypes.release.externalNativeBuild.cmake
  releaseCmake.arguments.removeAll { it == "-DHERMES_ENABLE_DEBUGGER=False" }
  releaseCmake.arguments.add("-DHERMES_ENABLE_DEBUGGER=True")
}

// This var needs to be defined outside any "remove_from_here" comment blocks
// because the "*/" in there could affect the resulted code by closing the comment to early.
def ktlintTarget = '**/*.kt'

subprojects { project ->
  if (project.name == "ReactAndroid") { return; }
  if (project.name == "packages") { return; }
  if (project.name.startsWith("vendored_")) { return; }
  if (project.name.startsWith("react-native")) { return; }
  if (project.projectDir.toString().contains("/node_modules/")) { return; }
  if (project.projectDir.toString().contains("/modules/")) { return; }

  // Add spotless to each local module's own classpath, not the root's: third-party libs request it
  // via their own plugins DSL and can't inherit it from us. Runs before the module's build script.
  project.buildscript.repositories {
    gradlePluginPortal()
    mavenCentral()
  }

  project.buildscript.dependencies.add("classpath", "com.diffplug.spotless:spotless-plugin-gradle:6.23.3")

  project.afterEvaluate {
    project.pluginManager.apply("com.diffplug.spotless")
    spotless {
      // note that spotless config is currently duplicated in bare-expo too
      kotlin {
        target(ktlintTarget)
        // TODO: (barthap) Replace this with raw string when dropped shell app macros
        // The star "*" signs interferes with slash "/" and treated wildcard path as comment ¯\_(ツ)_/¯
        targetExclude(["**", "versioned/host/exp/exponent/modules/api", "**", "*.kt"].join("/"))
        ktlint("1.0.1")
          .editorConfigOverride([
            "ktlint_standard_no-wildcard-imports"           : "disabled",
            "ktlint_standard_import-ordering"               : "disabled",
            "ktlint_standard_filename"                      : "disabled",
            "ktlint_standard_property-naming"               : "disabled",
            "ktlint_standard_discouraged-comment-location"  : "disabled",
            "ktlint_standard_comment-wrapping"              : "disabled",
            "ktlint_standard_function-naming"               : "disabled",
            "ktlint_standard_class-naming"                  : "disabled",
            "ktlint_standard_package-name"                  : "disabled",
            "ktlint_standard_multiline-expression-wrapping" : "disabled",
            "charset"                  : "utf-8",
            "end_of_line"              : "lf",
            "indent_size"              : "2",
            "continuation_indent_size" : "2",
            "indent_style"             : "space",
            "insert_final_newline"     : "true",
            "tab_width"                : "2",
            "trim_trailing_whitespace" : "true",
            "ij_kotlin_allow_trailing_comma_on_call_site": "false",
            "ij_kotlin_allow_trailing_comma": "false"
          ])
        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
      }
    }
  }
}

apply plugin: "expo-root-project"
