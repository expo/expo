buildscript {
  // Simple helper that allows the root project to override versions declared by this library.
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
  }

  dependencies {
    classpath(expoLibs.apollo.gradle)
    classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:${safeExtGet('kspVersion', '2.3.10')}"
  }
}

plugins {
  alias libs.plugins.android.library
  alias libs.plugins.download
  id("org.jetbrains.kotlin.plugin.compose") version "2.3.20"
  id("org.jetbrains.kotlin.plugin.serialization") version "2.3.20" // Use your Kotlin version
  id 'expo-module-gradle-plugin'
}
apply plugin: 'com.google.devtools.ksp'
apply from: new File(rootDir, "versioning_linking.gradle")
apply plugin: 'com.apollographql.apollo'

expoModule {
  canBePublished false
}

def reactProperties = new Properties()
file("${project(':packages:react-native:ReactAndroid').projectDir}/gradle.properties").withInputStream { reactProperties.load(it) }

// WHEN_VERSIONING_REMOVE_FROM_HERE
//maven repository info
group = 'host.exp.exponent'
version = '45.0.0'
// WHEN_VERSIONING_REMOVE_TO_HERE

repositories {
  mavenCentral()
  maven { url "https://jitpack.io" }
}

apply plugin: 'com.facebook.react'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

react {
  /* Autolinking */
  autolinkLibrariesWithApp()
}


android {
  namespace "host.exp.expoview"

  buildFeatures {
    buildConfig true
    compose true
  }

  composeOptions {
    kotlinCompilerExtensionVersion = "1.5.14"
  }

  // Used to override the NDK path/version on internal CI or by allowing
  // users to customize the NDK path/version from their root project (e.g. for M1 support)
  if (rootProject.hasProperty("ndkPath")) {
    ndkPath rootProject.ext.ndkPath
  }
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  flavorDimensions += "device"
  productFlavors {
    quest { dimension "device" }
    mobile { dimension "device" }
  }

  buildFeatures {
    viewBinding true
    compose true
  }

  defaultConfig {
    versionCode 1
    versionName "1.0"

    /* WHEN_VERSIONING_UNCOMMENT_FROM_HERE
    missingDimensionStrategy('versioning', 'versioned')
    WHEN_VERSIONING_UNCOMMENT_TO_HERE */

    // WHEN_VERSIONING_REMOVE_FROM_HERE
    manifestPlaceholders = [
      'appAuthRedirectScheme': 'host.exp.exponent'
    ]

    buildConfigField("boolean", "IS_INTERNAL_BUILD", "false")
    buildConfigField("int", "EXOPACKAGE_FLAGS", "0")
    buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true")
    // WHEN_VERSIONING_REMOVE_TO_HERE
  }

  buildTypes {
    release {
      consumerProguardFiles('proguard-rules.pro')
    }
  }
}

apollo {
  service("service") {
    packageName.set("host.exp.exponent.graphql")
    srcDir("src/main/graphql")

    introspection {
      endpointUrl.set("https://api.expo.dev/graphql")
      schemaFile.set(file("src/main/graphql/schema.graphqls"))
    }
  }
}

