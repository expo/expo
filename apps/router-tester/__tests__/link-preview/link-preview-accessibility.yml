appId: dev.expo.routertester
name: Link preview accessibility
---
- stopApp: dev.expo.routertester
# A dev client opens its launcher on a cold deep link. Connect it to Metro on 8081 (from maestro/test.sh) first.
- openLink: router-tester://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- extendedWaitUntil:
    visible: "Current Path: /"
    timeout: 60000
- openLink: router-tester://link-preview/misc
- runFlow: ../close-warning.yml
# Maestro reads the accessibility tree, so these steps fail when a `Link.Trigger` with `Link.Preview` is not in it.
- assertVisible: "Link.Preview: /misc"
- scrollUntilVisible:
    element:
      id: "preview-trigger-pressable"
    direction: DOWN
- tapOn:
    id: "preview-trigger-pressable"
- assertVisible: "One"
