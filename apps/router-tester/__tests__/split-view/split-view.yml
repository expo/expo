appId: dev.expo.routertester
name: Split view
---
- stopApp: dev.expo.routertester
- openLink: router-tester://split-view
- runFlow: ../close-warning.yml
- tapOn: "Passkeys"
- assertVisible: "Github"
- tapOn: "Github"
- assertVisible: "ID: Github"
# On iPhone this is the back button of the detail column. On iPad it is the sidebar card.
- tapOn: "Passkeys"
- assertNotVisible: "ID: Github"
- assertVisible: "Github"
