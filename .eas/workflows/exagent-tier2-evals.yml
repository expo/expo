# Tier 2 evals for exagent (llp/0002 in packages/exagent): a frontier agent (Claude Code
# headless) drives the eval scenarios for real. Advisory, never blocks merge — the eval
# step reports its result through the PR comment instead of failing the job.
#
# Trigger: label a PR with "exagent-eval" (mirrors expo/skills' label-triggered evals),
# or dispatch manually.
#
# Prerequisite: ANTHROPIC_API_KEY must exist in the EAS "production" environment.
name: exagent-tier2-evals

on:
  pull_request_labeled:
    labels:
      - exagent-eval
  workflow_dispatch: {}

jobs:
  tier2:
    name: tier 2 agent evals
    runs_on: linux-medium
    environment: production
    outputs:
      result: ${{ steps.evals.outputs.result }}
      summary: ${{ steps.evals.outputs.summary }}
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: npx --yes pnpm@10.33.0 install --ignore-scripts --frozen-lockfile --filter exagent...

      - name: Build exagent
        run: npx --yes pnpm@10.33.0 --dir packages/exagent build

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Run tier 2 evals
        id: evals
        # Report-only: capture the outcome for the PR comment, do not fail the job.
        run: |
          set +e
          node packages/exagent/evals/run.mjs --tier 2 | tee /tmp/tier2.log
          code=$?
          set-output result "$([ "$code" -eq 0 ] && echo pass || echo fail)"
          set-output summary "$(tail -n 20 /tmp/tier2.log | head -c 1500)"
          exit 0

  comment:
    name: comment
    after: [tier2]
    type: github-comment
    params:
      payload: |
        <!-- exagent-tier2-evals -->
        ## exagent tier 2 evals (Claude Code headless)

        Result: **${{ after.tier2.outputs.result }}**

        ```
        ${{ after.tier2.outputs.summary }}
        ```

        📎 [Full log](${{ workflow.url }}) — advisory only, never blocks merge (llp/0002).
