name: SDK cherry-pick

# SECURITY: `pull_request_target` runs this workflow from the default branch with secrets, also
# for pull requests from forks. No job checks out or runs code from a pull request. Every script,
# action, and `et` command comes from a checkout of the default branch. The merge commit and the
# release branch are read only as git data. The changesets that a pull request author wrote are
# read only as text: `et sdk-cherry-pick` copies their summaries into CHANGELOG.md entries with the
# code of `et convert-backport-changesets`, and runs nothing from them.
on:
  pull_request_target:
    types: [closed, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the pull request on main to backport'
        required: true
        type: number
      sdk:
        description: 'SDK version of the target branch, such as 58 for sdk-58'
        required: true
        type: number
      dry_run:
        description: 'Show what would happen. Do not push, open a pull request, or comment.'
        type: boolean
        default: true

# GITHUB_TOKEN only reads. Every write uses EXPO_BOT_GITHUB_TOKEN, and only the steps that
# publish get it.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # The repository variable SDK_CHERRY_PICK_DISABLED set to `true` stops backports from merges and
  # labels. A manual run still works, so a dry run can test the bot while it is off.
  select:
    name: Select SDK versions
    if: >-
      github.repository == 'expo/expo'
      && (github.event_name == 'workflow_dispatch'
      || (vars.SDK_CHERRY_PICK_DISABLED != 'true'
      && github.event.pull_request.merged && github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      sdks: ${{ steps.select.outputs.sdks }}
    steps:
      # On `closed`, every `sdk-NN` label. On `labeled`, only the label that was added. A label with
      # a leading zero, such as `sdk-058`, is ignored with a warning. The bot backports only to SDK
      # 55 and later. An older `sdk-NN` label names an SDK that the change affects, so it is
      # ignored with a notice.
      - name: Select SDK versions
        id: select
        run: |
          min_sdk=55
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sdk=$(jq -r '.inputs.sdk | tostring' "$GITHUB_EVENT_PATH")
            if ! [[ "$sdk" =~ ^[1-9][0-9]*$ ]] || [ "$sdk" -lt "$min_sdk" ]; then
              echo "::error::The bot backports only to SDK $min_sdk and later, but the sdk input is \"$sdk\". Run the workflow again with an SDK version of $min_sdk or later."
              exit 1
            fi
          fi
          jq -r --argjson min "$min_sdk" '
            if .action == "labeled" then .label.name else .pull_request.labels[]?.name end
            | if test("^sdk-0[0-9]*$") then
                "::warning::The label \"\(.)\" is ignored because its version starts with 0. Use a label such as \"sdk-58\"."
              elif test("^sdk-[1-9][0-9]*$") and (.[4:] | tonumber) < $min then
                "::notice::The label \"\(.)\" is ignored because the bot backports only to SDK \($min) and later."
              else empty
              end
          ' "$GITHUB_EVENT_PATH"
          sdks=$(jq -c --arg event "$GITHUB_EVENT_NAME" --argjson min "$min_sdk" '
            def sdk: capture("^sdk-(?<version>[1-9][0-9]*)$").version | select(tonumber >= $min);
            if $event == "workflow_dispatch" then [.inputs.sdk | tostring]
            elif .action == "labeled" then [.label.name | sdk]
            else [.pull_request.labels[]?.name | sdk]
            end
            | unique
          ' "$GITHUB_EVENT_PATH")
          echo "Selected SDK versions: $sdks"
          echo "sdks=$sdks" >> "$GITHUB_OUTPUT"

  cherry-pick:
    name: Backport to sdk-${{ matrix.sdk }}
    needs: select
    if: needs.select.outputs.sdks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.select.outputs.sdks) }}
    concurrency:
      group: sdk-cherry-pick-${{ github.event.pull_request.number || inputs.pr }}-${{ matrix.sdk }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      SDK_VERSION: ${{ matrix.sdk }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      REPO_DIR: ${{ github.workspace }}
      # JS-only job, so skip the ~685 MB @shopify/react-native-skia prebuilt-binary download.
      SKIP_SKIA_DOWNLOAD: '1'
    steps:
      # SECURITY: the default branch, never the pull request head or its base branch.
      # persist-credentials is off, so no token is in .git/config while prepare runs.
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      # Every existing release branch needs expotools. A missing branch needs nothing: an `sdk-NN`
      # label can name an SDK that a change affects, or a release that has no branch yet, so the job
      # ends without a backport and without a comment.
      - name: 🔍 Check the target branch
        id: target
        run: |
          tools=true
          heads=$(git -C "$REPO_DIR" ls-remote --heads origin "refs/heads/sdk-$SDK_VERSION")
          if [ -z "$heads" ]; then
            echo "sdk-$SDK_VERSION does not exist."
            tools=false
          fi
          echo "tools=$tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
      - name: 🔨 Install pnpm
        if: steps.target.outputs.tools == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - name: 🔨 Setup Node
        if: steps.target.outputs.tools == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: 📦 Install dependencies
        if: steps.target.outputs.tools == 'true'
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: ♻️ Restore caches
        if: steps.target.outputs.tools == 'true'
        uses: ./.github/actions/expo-caches
      - name: 🛠 Build expotools
        id: build
        if: steps.target.outputs.tools == 'true'
        run: pnpm turbo build --filter expotools...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      # prepare and publish are separate steps so that the token that can push is only in the
      # environment of publish. prepare reads changesets and other text that a pull request author
      # wrote.
      - name: 🍒 Cherry-pick and convert changesets
        id: prepare
        if: steps.target.outputs.tools == 'true'
        run: node tools/bin/expotools.js sdk-cherry-pick prepare
        env:
          GH_TOKEN: ${{ github.token }}
      # Also after a failed prepare, so that it can tell the author that the backport failed.
      - name: 📝 Open the backport pull request
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/bin/expotools.js sdk-cherry-pick publish
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
      # When the checkout, the target check, the install, or the build fails, or publish fails before
      # it starts, nothing has told the author. This step does, with the text of the publish fallback
      # comment. publish writes publish-started first, and comments itself after that. This step
      # reads no text from the pull request, and it does not run for a manual run.
      - name: 💬 Comment that the backport failed
        if: failure() && github.event_name == 'pull_request_target' && (steps.publish.outcome == 'failure' || (steps.build.outcome != 'success' && (steps.target.outputs.tools == 'true' || steps.target.outcome == 'failure' || steps.target.outcome == 'skipped')))
        run: |
          state_dir="${STATE_DIR:-${RUNNER_TEMP%/}/sdk-cherry-pick-$PR_NUMBER-$SDK_VERSION}"
          if [ -e "$state_dir/publish-started" ]; then
            echo "publish started, so it reports its own failure."
            exit 0
          fi
          target_branch="sdk-$SDK_VERSION"
          work_branch="bot/sdk-$SDK_VERSION-cherry-pick-$PR_NUMBER"
          run_log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # shellcheck disable=SC2016 # Backticks in single quotes are Markdown code spans.
          printf -v body 'The backport to `%s` failed before it could finish, so no backport pull request was opened. [Run log](%s)\n\nTo backport it by hand:\n\n```sh\ngit fetch origin main %s\ngit checkout -b %s origin/%s\ngit cherry-pick -x %s\n```\n\nIf `%s` has no `.changeset/config.json`, it does not use changesets. Then, for each `.changeset/*.md` file that this pull request adds, add its summary as an entry under `## Unpublished` in the `CHANGELOG.md` of each package that it names, and delete the changeset file.' \
            "$target_branch" "$run_log" "$target_branch" "$work_branch" "$target_branch" \
            "${MERGE_SHA:-<merge commit of #$PR_NUMBER>}" "$target_branch"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
