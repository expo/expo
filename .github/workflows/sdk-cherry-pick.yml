name: SDK cherry-pick

# SECURITY: `pull_request_target` runs this workflow from the default branch with secrets, also for
# pull requests from forks. Only cherry-pick and push get the bot token, and they run only code from
# the default branch. They read the merged change as git data with hooks off, and its changesets only
# as text. They restore no cache.
# rebuild runs code from sdk-NN plus the merged change. It has no secret and a read-only token. That
# code can reach the Actions runtime token. With it, the code can write caches in the main scope that
# other workflows restore, and it can upload the artifact of another rebuild leg. The team accepts
# this risk, because the code is merged sdk-NN code, installed from a frozen lockfile.
# push checks that the artifact belongs to its own leg: the patch was built on the sdk-NN tip, and it
# changes only regular files in build/ folders of the leg's packages. A leg can still forge that base.
on:
  pull_request_target:
    types: [closed, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the pull request on main to backport'
        required: true
        type: number
      sdk:
        description: 'SDK version of the target branch, such as 58 for sdk-58'
        required: true
        type: number
      dry_run:
        description: 'Show what would happen. Do not push or comment.'
        type: boolean
        default: true

permissions: {}

jobs:
  cherry-pick:
    name: Backport to SDK branches
    # On `closed`, every `sdk-NN` label. On `labeled`, only the label that was added.
    if: >-
      github.repository == 'expo/expo'
      && (github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged
      && (github.event.action == 'labeled' && startsWith(github.event.label.name, 'sdk-')
      || github.event.action == 'closed' && contains(join(github.event.pull_request.labels.*.name, ' '), 'sdk-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      merge-sha: ${{ steps.backport.outputs.merge-sha }}
      rebuilds: ${{ steps.backport.outputs.rebuilds }}
    concurrency:
      group: sdk-cherry-pick-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.label.name || inputs.sdk || 'merged' }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      SDK_VERSION: ${{ inputs.sdk }}
      LABELS: ${{ github.event.action == 'labeled' && toJSON(github.event.label.name) || toJSON(github.event.pull_request.labels.*.name) }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      REPO_DIR: ${{ github.workspace }}
      SKIP_SKIA_DOWNLOAD: '1'
    steps:
      # SECURITY: the default branch, never the pull request head. No token is stored in .git/config.
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: 🔨 Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      - name: 🔨 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: 📦 Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: 🛠 Build expotools
        run: pnpm turbo build --filter expotools...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: 🍒 Backport
        id: backport
        run: node tools/bin/expotools.js sdk-cherry-pick
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
      # The backport step comments on its own failures, so this step covers only the steps before it.
      - name: 💬 Comment that the backport failed
        if: failure() && github.event_name == 'pull_request_target' && steps.backport.outcome != 'failure'
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The SDK backport failed before it started, so this change did not land on any sdk-NN branch. The [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) has the details."
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}

  # The build output does not depend on CHANGELOG.md or changesets, so a plain cherry-pick is enough.
  rebuild:
    name: Rebuild build/ for sdk-${{ matrix.sdk }}
    needs: cherry-pick
    if: ${{ !cancelled() && needs.cherry-pick.outputs.rebuilds != '' && needs.cherry-pick.outputs.rebuilds != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cherry-pick.outputs.rebuilds) }}
    env:
      PACKAGES: ${{ join(matrix.packages, ' ') }}
      DIRS: ${{ join(matrix.dirs, ' ') }}
      SKIP_SKIA_DOWNLOAD: '1'
    steps:
      - name: 👀 Checkout sdk-${{ matrix.sdk }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: 🍒 Cherry-pick the change
        run: |
          git fetch --quiet --no-tags --depth=2 origin "$MERGE_SHA"
          git -c user.name='Expo Bot' -c user.email=34669131+expo-bot@users.noreply.github.com cherry-pick -x "$MERGE_SHA"
        env:
          MERGE_SHA: ${{ needs.cherry-pick.outputs.merge-sha }}
      # As the check-packages job of the branch's own sdk.yml: Node 20, Bun, and the package manager
      # of its lockfile. sdk-55 uses yarn. sdk-56 and sdk-57 use pnpm 10.
      - name: 🔨 Install pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - name: 🔨 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: 🏗️ Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true
      - name: 📦 Install dependencies of the branch
        run: if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else pnpm install --frozen-lockfile; fi
      # check-packages silently skips a package without a build script, so one that tracks build/
      # files fails here. expotools can exit 0 when it fails to compile itself. Either way, the empty
      # patch would read as "nothing to push".
      - name: 🛠 Rebuild the packages
        run: |
          read -ra names <<< "$PACKAGES"
          read -ra dirs <<< "$DIRS"
          build=()
          for i in "${!dirs[@]}"; do
            if jq -e '.scripts.build | strings | length > 0' "${dirs[i]}/package.json" > /dev/null; then
              build+=("${names[i]}")
            elif [[ "$(git ls-files -- "${dirs[i]}")" == */build/* ]]; then
              echo "::error::${dirs[i]} tracks build/ files but has no build script, so check-packages would not rebuild them."
              exit 1
            fi
          done
          if [ "${#build[@]}" -gt 0 ]; then
            set -o pipefail
            node tools/bin/expotools.js check-packages "${build[@]}" --no-test --no-lint --no-uniformity-check --no-dependency-check \
              | tee "$RUNNER_TEMP/check-packages.log"
            if ! grep -qF '🏁 All packages passed.' "$RUNNER_TEMP/check-packages.log"; then
              echo "::error::check-packages did not report that all packages passed, so the build/ folders may be stale."
              exit 1
            fi
          fi
      # check-packages compares `git status`, so new build files count too. `git add -N` puts them in
      # the diff without staging their content. It skips ignored files, such as node_modules. The patch
      # keeps only the paths that push accepts.
      - name: 📦 Write the patch of the build/ folders
        run: |
          mkdir -p "$RUNNER_TEMP/rebuild"
          git rev-parse HEAD^ > "$RUNNER_TEMP/rebuild/base"
          read -ra dirs <<< "$DIRS"
          git add -N -- "${dirs[@]}"
          mapfile -t pathspecs < <(printf ':(glob)%s/**/build/**\n' "${dirs[@]}")
          git diff --binary --no-renames --no-ext-diff --no-textconv HEAD -- "${pathspecs[@]}" > "$RUNNER_TEMP/rebuild/build.patch"
      - name: 📤 Upload the patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-cherry-pick-build-${{ matrix.sdk }}
          path: ${{ runner.temp }}/rebuild/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Each leg runs even when another rebuild leg failed. A failed rebuild uploads no patch, so its
  # push leg finds none and comments instead of pushing.
  push:
    name: Push the backport to sdk-${{ matrix.sdk }}
    needs: [cherry-pick, rebuild]
    if: ${{ !cancelled() && needs.cherry-pick.outputs.rebuilds != '' && needs.cherry-pick.outputs.rebuilds != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cherry-pick.outputs.rebuilds) }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      SDK_VERSION: ${{ matrix.sdk }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      REPO_DIR: ${{ github.workspace }}
      SKIP_SKIA_DOWNLOAD: '1'
      MERGE_SHA: ${{ needs.cherry-pick.outputs.merge-sha }}
      # The same steps that Backport.ts comments for a branch without changesets.
      MANUAL_STEPS: |-
        To backport it by hand:

        ```sh
        git fetch origin ${{ matrix.branch }}
        git checkout ${{ matrix.branch }}
        git pull --ff-only origin ${{ matrix.branch }}
        git cherry-pick -x ${{ needs.cherry-pick.outputs.merge-sha }}
        ```

        Next, move the summary of each `.changeset/*.md` file that this pull request adds into an entry under `## Unpublished` in the `CHANGELOG.md` of each package that it names, and delete the file. Then rebuild the `build/` output of each package that the change touches, commit the result, and run `git push origin ${{ matrix.branch }}`.
    steps:
      # SECURITY: the default branch, never the pull request head. No token is stored in .git/config.
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 📥 Download the patch
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-cherry-pick-build-${{ matrix.sdk }}
          path: ${{ runner.temp }}/rebuild
      # Only a patch that passes reaches BUILD_PATCH. The backport step comments when it is missing.
      # `--ignore-submodules=none`, so that a `.gitmodules` of the branch cannot hide a gitlink.
      - name: 🔍 Check the patch
        id: check
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          base=$(cat "$RUNNER_TEMP/rebuild/base")
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The base of the patch is not a commit sha."
            exit 1
          fi
          if ! jq -e 'all(test("\\s") | not)' <<< "$DIRS" > /dev/null; then
            echo "::error::A package folder of this leg has whitespace in its name: $DIRS"
            exit 1
          fi
          mapfile -t dirs < <(jq -r '.[]' <<< "$DIRS")
          patch="$RUNNER_TEMP/rebuild/build.patch"
          if [ -s "$patch" ]; then
            git fetch --quiet --no-tags --depth=2 origin "$base" "$MERGE_SHA"
            git worktree add --quiet --detach "$RUNNER_TEMP/check" "$base"
            git -C "$RUNNER_TEMP/check" -c core.hooksPath=/dev/null -c user.name='Expo Bot' -c user.email=34669131+expo-bot@users.noreply.github.com \
              cherry-pick -x "$MERGE_SHA"
            git -C "$RUNNER_TEMP/check" apply --cached "$patch"
            git -C "$RUNNER_TEMP/check" diff --cached --raw -z --no-renames --ignore-submodules=none > "$RUNNER_TEMP/staged"
            regular='^(000000|100644|100755)$'
            while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
              read -r old new _ <<< "${meta#:}"
              in_build=false
              for dir in "${dirs[@]}"; do
                [[ "$path" == "$dir"/* && "/${path#"$dir"/}" == */build/* ]] && in_build=true
              done
              if ! $in_build || [[ "/${path,,}" == */.git* ]] \
                || ! [[ "$old" =~ $regular && "$new" =~ $regular ]] \
                || [[ "$old" != 000000 && "$new" != 000000 && "$old" != "$new" ]]; then
                echo "::error::The patch changes $path from mode $old to $new. It may change only regular files in build/ folders of $DIRS."
                exit 1
              fi
            done < "$RUNNER_TEMP/staged"
          fi
          cp "$patch" "$BUILD_PATCH"
          echo "base=$base" >> "$GITHUB_OUTPUT"
        env:
          DIRS: ${{ toJSON(matrix.dirs) }}
          BUILD_PATCH: ${{ runner.temp }}/checked.patch
      - name: 🔨 Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      - name: 🔨 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: 📦 Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: 🛠 Build expotools
        run: pnpm turbo build --filter expotools...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: 🍒 Backport with the rebuilt build/
        id: backport
        run: node tools/bin/expotools.js sdk-cherry-pick
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          BUILD_PATCH: ${{ runner.temp }}/checked.patch
          BUILD_BASE: ${{ steps.check.outputs.base }}
          BUILD_CHECK: ${{ steps.check.outcome }}
      - name: 💬 Comment that the backport failed
        if: failure() && github.event_name == 'pull_request_target' && steps.backport.outcome != 'failure'
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The backport to \`sdk-$SDK_VERSION\` failed before it started, so this change did not land on that branch. The [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) has the details.

          $MANUAL_STEPS"
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
