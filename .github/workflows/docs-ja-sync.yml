name: Docs Japanese Sync

defaults:
  run:
    shell: bash

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'docs/pages/tutorial/**'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'expo/expo'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JA_TRANSLATOR_MODEL: claude-opus-5-5
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: ⬢ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: 🤖 Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.280
      - name: 🔑 Prepare model env
        uses: ./.github/actions/prepare-model-env
        with:
          c1: ${{ secrets.ECR_1 }}
          c2: ${{ secrets.ECR_2 }}
          c3: ${{ secrets.ECR_3 }}
          c4: ${{ secrets.ECR_4 }}
          c5: ${{ secrets.ECR_5 }}
          fallback: ${{ secrets.CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN }}
          model: ${{ env.JA_TRANSLATOR_MODEL }}
      - name: 🌐 Sync stale Japanese pages
        id: sync
        working-directory: docs
        env:
          JA_SYNC_SUMMARY: ${{ runner.temp }}/ja-sync-summary.md
        run: node --experimental-strip-types checks/ja/translate.ts
      - name: 📝 Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          branch: bot/docs-ja-sync
          base: main
          add-paths: |
            docs/pages/ja
            docs/checks/ja/source-hashes.json
          commit-message: '[docs] Sync Japanese tutorial translations'
          title: '[docs] Sync Japanese tutorial translations'
          body-path: ${{ runner.temp }}/ja-sync-summary.md
          labels: docs
          delete-branch: true
          committer: Expo Bot <expo-bot@users.noreply.github.com>
          author: Expo Bot <expo-bot@users.noreply.github.com>
          reviewers: amandeepmittal
      - name: 🚨 Surface skipped pages
        if: steps.sync.outputs.skipped != '0'
        run: |
          echo "::error::Some Japanese pages were not synced. Check the 'Sync stale Japanese pages' step log for details."
          exit 1
      - name: 🔔 Notify on Slack
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.slack_webhook_docs }}
          channel: '#docs'
          author_name: Docs Japanese sync
