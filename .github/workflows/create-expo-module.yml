name: Create Expo Module

on:
  push:
    branches: [main, 'sdk-*']
    paths: &trigger_paths
      - .github/workflows/create-expo-module.yml
      - packages/create-expo-module/**
      - packages/expo-module-template/**
      - packages/expo/bundledNativeModules.json
      - templates/expo-template-blank-typescript/package.json
      - pnpm-lock.yaml
  pull_request:
    paths: *trigger_paths
  schedule:
    - cron: 0 14 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # JS-only job, so skip the ~685 MB @shopify/react-native-skia prebuilt-binary download.
  SKIP_SKIA_DOWNLOAD: '1'

jobs:
  test:
    if: >-
      (github.event_name != 'schedule' || github.repository == 'expo/expo') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       !startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
      - name: ⬇️ Fetch commits from base branch
        run: git fetch origin ${{ github.event.before || github.base_ref || 'main' }}:${{ github.event.before || github.base_ref || 'main' }} --depth 100
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
      - name: 🏗️ Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: 📦 Install node modules in root dir
        run: pnpm install --frozen-lockfile
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: 🛠 Build create-expo-module
        run: pnpm run prepublishOnly
        working-directory: packages/create-expo-module
      - name: 🧪 Unit Test create-expo-module
        run: pnpm test
        working-directory: packages/create-expo-module
      - name: 🧪 E2E Test create-expo-module
        run: pnpm test:e2e
        working-directory: packages/create-expo-module
