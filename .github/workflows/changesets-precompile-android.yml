name: Changesets Precompile Android

# Precompiles Android Maven repositories for the "Version packages" PR into the Turbo remote
# cache, so `stable-publish` in publish-packages.yml can reuse them instead of building them
# itself. It waits for in-progress runs of this workflow before publishing.

on:
  workflow_dispatch: {}
  pull_request:

concurrency:
  # Release PRs reuse the same branch; only cancel older runs for the same PR.
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precompile:
    name: Changesets native precompile (Android, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: concurrency-16
            concurrency: 16
          - variant: concurrency-4
            concurrency: 4
    if: >-
      github.repository == 'expo/expo' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.head_ref == '@brent/precompile-android-blacksmith' || startsWith(github.head_ref, 'changeset-release/') &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Blacksmith's largest x64 runner: 32 vCPU, 128 GB.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RCT_HERMES_V1_ENABLED: '1'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: expo
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔑 Verify Turbo cache credentials
        run: test -n "$TURBO_TOKEN" || (echo "TURBO_TOKEN is not set" >&2; exit 1)
      - name: 🔨 Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - name: ⬢ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: 🔨 Use JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: ♻️ Restore caches
        uses: ./.github/actions/expo-caches
        with:
          gradle: 'true'
      - name: ➕ Add `bin` to GITHUB_PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH
      - name: 📦 Install node modules
        run: pnpm install --frozen-lockfile
      - name: 🧪 Start machine sampling
        run: |
          nproc; free -g; df -h /tmp | tail -1
          nohup vmstat -n -t 10 > "$RUNNER_TEMP/vmstat.log" 2>&1 &
      - name: 🏗️ Precompile embedded Maven repositories
        timeout-minutes: 80
        env:
          EXPO_PRECOMPILE_ANDROID_PROFILE_DIR: ${{ github.workspace }}/.turbo/gradle-profiles
        run: |
          echo "Precompiling commit ${{ github.sha }}"
          expo-turbo run precompile-android --concurrency=${{ matrix.concurrency }} --force --summarize \
            --log-order=stream --env-mode=loose
      - name: 📊 Summarize machine usage
        if: always()
        run: |
          awk 'NR>2 && $13 ~ /^[0-9]+$/ { n++; us+=$13; sy+=$14; id+=$15; wa+=$16; r+=$1; if ($4/1048576 < minfree || n==1) minfree=$4/1048576; so+=$8 }
            END { if (n) printf "samples=%d avg: user=%.0f%% sys=%.0f%% idle=%.0f%% iowait=%.0f%% runnable=%.1f min-free=%.1fGB swap-out=%d\n", n, us/n, sy/n, id/n, wa/n, r/n, minfree, so }' "$RUNNER_TEMP/vmstat.log"
          cp "$RUNNER_TEMP/vmstat.log" .turbo/ 2>/dev/null || true
      - name: 💾 Upload timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: precompile-timings-${{ matrix.variant }}
          path: |
            .turbo/runs/*.json
            .turbo/vmstat.log
            .turbo/gradle-profiles/**
