name: iOS Unit Tests

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &trigger_paths
      - .github/workflows/ios-unit-tests.yml
      - packages/**/ios/**
      - packages/**/apple/**
      - apps/bare-expo/ios/**
      - tools/src/commands/IosNativeUnitTests.ts
      - tools/src/commands/NativeUnitTests.ts
      - tools/src/AffectedPackages.ts
      - Gemfile
      - Gemfile.lock
      - '!packages/@expo/cli/**'
  push:
    branches: [main]
    paths: *trigger_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Draft pull requests skip this paid macOS job. Marking the pull request ready for review runs it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 75
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history for `--affected` to diff against the base branch (same approach
          # as .github/workflows/sdk.yml).
          fetch-depth: 100
      - name: ⬇️ Fetch commits from base branch
        run: git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth 100
        if: github.event_name == 'pull_request'
      - name: 🔨 Switch to Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app
      - name: ➕ Add `bin` to GITHUB_PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH
      - name: 🔨 Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      # These steps don't depend on each other.
      - parallel:
          - name: 💎 Setup Ruby and install gems
            uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
            with:
              bundler-cache: true
              ruby-version: 3.4.11
          - name: 🧹 Reset simulators
            run: |
              xcrun simctl list devices --json
              xcrun simctl erase all
              xcrun simctl shutdown all
              sudo xcodebuild -runFirstLaunch
          - name: 🔨 Setup Node
            uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            with:
              node-version: 24
              cache: 'pnpm'
          - name: Setup ccache
            uses: ./.github/actions/setup-ccache
          - name: ♻️ Restore caches
            uses: ./.github/actions/expo-caches
            id: expo-caches
            with:
              ccache: 'true'
              bare-expo-pods: 'true'
              # Unit tests build Debug, while Test Suite e2e builds the same app Release. They'd
              # otherwise share one cache entry, and whichever saved it first would decide which
              # React.xcframework the other restored. A Release framework in a Debug build fails
              # to link, since Debug ExpoModulesCore references debug-only Fabric symbols.
              bare-expo-pods-configuration: 'Debug'
              ccache-variant: 'unit-tests-debug'
              expo-modules-jsi-xcframework: 'true'
      - name: Reset ccache stats
        run: ccache -z
      - name: 📦 Install node modules
        run: pnpm install --frozen-lockfile
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      # Always run pod install (the restored Pods cache only speeds it up) — it generates
      # files outside the Pods dir that the cache doesn't carry, e.g. ReactCodegen sources
      # in `ios/build/generated` and expo-updates' vendored bspatch.c.
      - name: 🥥 Install CocoaPods in `apps/bare-expo/ios`
        run: pod install
        working-directory: apps/bare-expo/ios
      # On pull requests, only test packages affected by the PR (and their dependents);
      # changes to the test infrastructure itself still trigger a full run. Pushes to main
      # always run everything.
      - name: 🧪 Run native iOS unit tests
        timeout-minutes: 60
        run: pnpm expotools native-unit-tests --platform ios ${{ github.event_name == 'pull_request' && format('--affected --since {0}', github.base_ref) || '' }}
      - name: Show ccache stats
        if: always()
        run: ccache -s -v
      - name: 📤 Upload xcresult
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-unit-tests-results
          path: /tmp/ios-unit-tests-results
