name: Docs link health reporter

defaults:
  run:
    shell: bash

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 4 * * 1'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.repository == 'expo/expo'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - name: ⬢ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: 📦 Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build Docs website
        working-directory: docs
        run: pnpm export
      - name: 🔗 Check internal links and anchors
        id: report
        working-directory: docs
        run: |
          title="$(pnpm --silent check-internal-links --issue-body "$RUNNER_TEMP/issue-body.md")"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: 🐛 Open issue
        if: steps.report.outputs.title != ''
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.report.outputs.title }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --label docs \
            --assignee amandeepmittal
