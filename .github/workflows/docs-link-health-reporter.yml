name: Docs link health reporter

defaults:
  run:
    shell: bash

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 4 * * 1'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.repository == 'expo/expo'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10
      - name: ⬢ Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: 📦 Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build Docs website
        working-directory: docs
        run: pnpm export
      - name: 🔗 Check internal links and anchors
        id: report
        working-directory: docs
        run: |
          title="$(pnpm --silent check-internal-links --issue-body "$RUNNER_TEMP/issue-body.md")"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: 🐛 Open issue
        if: steps.report.outputs.title != ''
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.report.outputs.title }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --label docs \
            --assignee amandeepmittal
