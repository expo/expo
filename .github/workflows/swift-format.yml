name: Swift Format

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/swift-format.yml
      - .swift-format
      - scripts/swift-format.sh
      - packages/expo-age-range/**/*.swift
      - packages/expo-app-integrity/**/*.swift
      - packages/expo-app-intents/**/*.swift
      - packages/expo-app-metrics/**/*.swift
      - packages/expo-application/**/*.swift
      - packages/expo-asset/**/*.swift
      - packages/expo-background-fetch/**/*.swift
      - packages/expo-battery/**/*.swift
      - packages/expo-blob/**/*.swift
      - packages/expo-brightness/**/*.swift
      - packages/expo-cellular/**/*.swift
      - packages/expo-constants/**/*.swift
      - packages/expo-document-picker/**/*.swift
      - packages/expo-haptics/**/*.swift
      - packages/expo-keep-awake/**/*.swift
      - packages/expo-linking/**/*.swift
      - packages/expo-live-photo/**/*.swift
      - packages/expo-modules-jsi/**/*.swift
      - packages/expo-network/**/*.swift
      - packages/expo-observe/**/*.swift
      - packages/expo-router/**/*.swift
      - packages/expo-sms/**/*.swift
      - packages/expo-splash-screen/**/*.swift
      - packages/expo-store-review/**/*.swift
      - packages/expo-system-ui/**/*.swift
      - packages/expo-tracking-transparency/**/*.swift
  pull_request:
    paths:
      - .github/workflows/swift-format.yml
      - .swift-format
      - scripts/swift-format.sh
      - packages/expo-age-range/**/*.swift
      - packages/expo-app-integrity/**/*.swift
      - packages/expo-app-intents/**/*.swift
      - packages/expo-app-metrics/**/*.swift
      - packages/expo-application/**/*.swift
      - packages/expo-asset/**/*.swift
      - packages/expo-background-fetch/**/*.swift
      - packages/expo-battery/**/*.swift
      - packages/expo-blob/**/*.swift
      - packages/expo-brightness/**/*.swift
      - packages/expo-cellular/**/*.swift
      - packages/expo-constants/**/*.swift
      - packages/expo-document-picker/**/*.swift
      - packages/expo-haptics/**/*.swift
      - packages/expo-keep-awake/**/*.swift
      - packages/expo-linking/**/*.swift
      - packages/expo-live-photo/**/*.swift
      - packages/expo-modules-jsi/**/*.swift
      - packages/expo-network/**/*.swift
      - packages/expo-observe/**/*.swift
      - packages/expo-router/**/*.swift
      - packages/expo-sms/**/*.swift
      - packages/expo-splash-screen/**/*.swift
      - packages/expo-store-review/**/*.swift
      - packages/expo-system-ui/**/*.swift
      - packages/expo-tracking-transparency/**/*.swift

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version of swift-format used by CI and contributors. Keep in sync with
  # the EXPECTED_VERSION constants in scripts/swift-format.sh.
  # No final 603.0.0 release exists yet; track the latest 603 prerelease,
  # which aligns with the swift-format Xcode 26.2 bundles.
  SWIFT_FORMAT_VERSION: '603.0.0-prerelease-2026-02-09'
  SWIFT_VERSION: '6.3'
  SWIFT_PLATFORM: ubuntu24.04

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🐦 Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          set -euo pipefail
          tag="swift-${SWIFT_VERSION}-RELEASE"
          slug="$(echo "$SWIFT_PLATFORM" | tr -d .)"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/${slug}/${tag}/${tag}-${SWIFT_PLATFORM}.tar.gz"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-13-dev libsqlite3-0 libstdc++-13-dev libxml2-dev \
            libz3-dev pkg-config tzdata unzip zlib1g-dev
          curl -fsSL "$url" -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
      - name: ♻️ Cache swift-format binary
        id: swift-format-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/swift-format
          key: swift-format-${{ runner.os }}-${{ env.SWIFT_FORMAT_VERSION }}
      - name: 🔨 Build swift-format ${{ env.SWIFT_FORMAT_VERSION }}
        if: steps.swift-format-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          tmp=$(mktemp -d)
          git clone --depth 1 --branch "$SWIFT_FORMAT_VERSION" https://github.com/swiftlang/swift-format.git "$tmp"
          (cd "$tmp" && swift build -c release)
          cp "$tmp/.build/release/swift-format" ~/.local/bin/swift-format
      - name: ➕ Add swift-format to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Only the packages listed here are linted. Keep this list, the `paths`
      # filters above, and the `swift:lint` scripts in each package.json in sync.
      - name: 🧹 Lint
        run: ./scripts/swift-format.sh --lint $PACKAGES
        env:
          PACKAGES: >-
            packages/expo-age-range
            packages/expo-app-integrity
            packages/expo-app-intents
            packages/expo-app-metrics
            packages/expo-application
            packages/expo-asset
            packages/expo-background-fetch
            packages/expo-battery
            packages/expo-blob
            packages/expo-brightness
            packages/expo-cellular
            packages/expo-constants
            packages/expo-document-picker
            packages/expo-haptics
            packages/expo-keep-awake
            packages/expo-linking
            packages/expo-live-photo
            packages/expo-modules-jsi
            packages/expo-network
            packages/expo-observe
            packages/expo-router
            packages/expo-sms
            packages/expo-splash-screen
            packages/expo-store-review
            packages/expo-system-ui
            packages/expo-tracking-transparency
