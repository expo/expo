# Thin adapter: the engine validates member reviews and reuses work mode.
# workflow_run uses the default branch and can access secrets for fork PRs.
name: verify (review)
run-name: "${{ github.event.workflow_run.display_title }} — ${{ github.event.workflow_run.actor.login }}"

on:
  workflow_run:
    workflows: ["verify (review request)"]
    types: [requested]

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  VERIFY_VERSION: ${{ vars.VERIFY_VERSION || '0.11.24' }}
  VERIFY_REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  intake:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == 'expo-bot/expo' &&
      github.event.workflow_run.actor.login != 'expo-bot'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.review.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check member review
        id: review
        run: npx --yes -p "@expo/verify@$VERIFY_VERSION" verify prepare-review
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    needs: intake
    if: needs.intake.outputs.target != ''
    concurrency:
      group: verify-target-${{ needs.intake.outputs.target }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    env:
      VERIFY_TARGET: ${{ needs.intake.outputs.target }}
      VERIFY_TARGET_IS_PR: 'true'
      VERIFY_RUN_ID: ${{ github.run_id }}
      MCP_URL: https://agile-minnow-543.convex.site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.280

      - name: Guard profile and credential env
        run: npx --yes -p "@expo/verify@$VERIFY_VERSION" verify verify-config

      - name: Mint scoped token
        run: npx --yes -p "@expo/verify@$VERIFY_VERSION" verify mint
        env:
          VERIFY_MCP_CONFIG: ${{ runner.temp }}/verify-mcp.json
          EXPO_SANDBOX_MCP_TOKEN: ${{ secrets.EXPO_SANDBOX_MCP_TOKEN }}

      - name: Run verify (review path)
        run: npx --yes -p "@expo/verify@$VERIFY_VERSION" verify run
        env:
          VERIFY_MCP_CONFIG: ${{ runner.temp }}/verify-mcp.json
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          VERIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          ECR_1: ${{ secrets.ECR_1 }}
          ECR_2: ${{ secrets.ECR_2 }}
          ECR_3: ${{ secrets.ECR_3 }}
          ECR_4: ${{ secrets.ECR_4 }}
          ECR_5: ${{ secrets.ECR_5 }}
          CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN }}

      - name: Revoke scoped token
        if: always()
        run: npx --yes -p "@expo/verify@$VERIFY_VERSION" verify revoke
        env:
          VERIFY_MCP_CONFIG: ${{ runner.temp }}/verify-mcp.json
          EXPO_SANDBOX_MCP_TOKEN: ${{ secrets.EXPO_SANDBOX_MCP_TOKEN }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-review-run-log-${{ needs.intake.outputs.target }}
          path: |
            .verify-out/run-log.txt
            .verify-out/findings.md
            .verify-out/review.md
            .verify-out/partial-findings.md
            .verify-out/denied-writes.txt
            .verify-out/publish-plan.json
            .verify-out/publish-outcome.json
            .verify-out/run-status.json
            .verify-out/triage/
          if-no-files-found: ignore
          retention-days: 14
