# Issue/PR verification agent, triggered by a maintainer comment:
#   /verify        investigate the report and post findings with attested evidence
#
# The agent is headless Claude Code connected to the expo-sandbox-mcp server
# (hosted E2B sandboxes, proxied EAS builds, hosted iOS simulators). It
# reproduces the report where the hosted simulator can exhibit it, runs
# cold-launch censuses / behavioral checks / crash loops as the issue
# demands, and posts ONE findings comment whose evidence sections
# (screenshots, census tables) are composed and attested by the server.
#
# SECURITY POSTURE (mirrors expo-code-review-command.yml):
# - `issue_comment` is NOT fork-restricted: this always runs in base-repo
#   context with secrets. We check out ONLY the trusted base ref, never a PR
#   head; nothing from the issue/PR executes on this runner. Untrusted code
#   from repro repos executes only inside the MCP server's sandboxes — that
#   containment is the server's entire design.
# - The gate controls who triggers: the `if:` filters to maintainer
#   associations, and an authoritative permission check requires write
#   access or higher (author_association alone does not prove write).
# - The comment body reaches shell only via env.
# - The agent reads attacker-authored issue text, so this workflow is
#   COMMENT-ONLY by construction: no fix-PRs, no pushes — its Bash surface
#   is a read-only gh allowlist plus a comment fallback, and the MCP
#   create_sandbox allowlisting is authorized by the gated maintainer
#   trigger itself (approval moves to the trigger, not skipped).
#
# SECRETS REQUIRED (repo settings):
# - EXPO_SANDBOX_MCP_TOKEN   headless bearer token for the expo-sandbox-mcp
#                            PROD deployment (the URL below). The
#                            deployment's stored Expo credential decides
#                            which account EAS builds bill; its stored
#                            GitHub PAT posts the findings comments (plain
#                            issues need Issues: Read and write on it).
#                            Move to a full service account later — see the
#                            trigger-gate TEMPORARY note.
# - CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN  REUSED from the AI code-review
#                            workflows — same engine (Claude Code CLI), one
#                            model credential to rotate. If usage ever needs
#                            separate attribution, split it back out.
# - EXPO_BOT_GITHUB_TOKEN    existing bot token (ack reactions, gh reads,
#                            comment fallback).
name: Verify issue (command)

on:
  issue_comment:
    types: [created]

# Scopes the automatic workflow token, which is what the AGENT step gets:
# issue comments yes, repository contents never. The agent therefore cannot
# push or write files even if an injected instruction tells it to — the
# boundary is the token's permissions, not a command-pattern allowlist.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  verify:
    # Job-level, NOT workflow-level: a workflow-level group is claimed at run
    # creation — before the `if:` below skips the job — so any unrelated
    # comment on this issue would cancel an in-flight verification and strand
    # its sandboxes and EAS builds. cancel-in-progress:false queues a second
    # /verify instead of killing the first.
    concurrency:
      group: verify-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Comments starting with /verify, on issues or PRs, from maintainer
    # associations. The authoritative write-access check is the step below.
    # (Runs are backed by the expo-verification-bot service account.)
    if: >-
      startsWith(github.event.comment.body, '/verify') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # EAS builds take 10-20 min each and a verification may need up to three,
    # plus censuses and the report. The MCP server TTL-reaps sandboxes
    # server-side, so a timeout here orphans nothing.
    timeout-minutes: 75
    continue-on-error: true
    steps:
      # author_association MEMBER does not imply write on THIS repo; the
      # requirement is write access or higher, checked against the
      # collaborators permission API.
      - name: Require write access
        id: gate
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission || echo none)
          case "$perm" in
            admin|maintain|write) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "/verify requires write access or higher; $ACTOR has: $perm"
              ;;
          esac

      - name: Acknowledge
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      # Watchable from the start: the Actions run streams the agent's live
      # progress, so the thread gets that link the moment work begins (the
      # findings comment lands separately when the investigation completes).
      - name: Announce run
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
            --body "🔍 \`/verify\` started for @${{ github.event.comment.user.login }} — [watch the investigation run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Findings will be posted here when it completes."

      # Base ref only — the prompt file must come from the trusted branch,
      # and no PR-head code may ever run on this runner.
      - name: Checkout (base ref only — never the PR head)
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        if: steps.gate.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Pinned exactly, like the code-review workflows.
      - name: Install Claude Code CLI
        if: steps.gate.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.212

      - name: Configure MCP
        if: steps.gate.outputs.ok == 'true'
        env:
          EXPO_SANDBOX_MCP_TOKEN: ${{ secrets.EXPO_SANDBOX_MCP_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/mcp.json" <<EOF
          {
            "mcpServers": {
              "sandbox": {
                "type": "http",
                "url": "https://agile-minnow-543.convex.site/mcp",
                "headers": { "Authorization": "Bearer $EXPO_SANDBOX_MCP_TOKEN" }
              }
            }
          }
          EOF

      - name: Run verification
        if: steps.gate.outputs.ok == 'true'
        env:
          # Same credential the code-review workflows feed their Claude Code
          # engine — it holds a Claude Code OAuth token, hence this env var
          # (ANTHROPIC_API_KEY is for raw API keys).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN }}
          # The AUTOMATIC workflow token, never the bot PAT: the bot PAT is
          # push-capable and write-scoped beyond this repo (sync-template.yml
          # pushes with it), and the job `permissions:` block does not limit
          # it. This token IS limited by that block, so the worst an injected
          # instruction achieves is an issue comment.
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_KIND: ${{ github.event.issue.pull_request != null && 'pull request' || 'issue' }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          # Pinned to Opus explicitly; override with a VERIFY_MODEL repo
          # variable (mirrors the code-review workflows' REVIEWER_MODEL).
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL || 'claude-opus-5' }}
        # Comment-only is enforced in THREE independent layers, because a
        # command-pattern allowlist alone is not a boundary (`gh api` accepts
        # -X POST, so a repos/<slug>/* rule would have permitted writes — it
        # is deliberately absent):
        #   1. the workflow token's `permissions:` block (no contents write),
        #   2. this allowlist: read-scoped Read/Glob/Grep, four fixed `gh`
        #      verbs, no Edit/Write/git/unrestricted Bash,
        #   3. the MCP token itself, scoped server-side to one sandbox with
        #      a short TTL (see Mint scoped token).
        # stream-json --verbose + a jq activity renderer, the same visibility
        # the code-review CLI gives its claude -p engine: every tool call and
        # assistant message lands in the Actions log live (which the announce
        # comment links), and the raw JSONL is uploaded as an artifact below.
        run: |
          prompt=$(cat .github/verify/prompt.md)
          set -o pipefail
          timeout 4200 claude -p \
            --model "$VERIFY_MODEL" \
            "Repository: $REPO. Target: $ISSUE_KIND #$ISSUE_NUMBER. Triggered by maintainer @$TRIGGER_ACTOR.

          $prompt" \
            --mcp-config "$RUNNER_TEMP/mcp.json" \
            --allowedTools "Read($GITHUB_WORKSPACE/**),Glob($GITHUB_WORKSPACE/**),Grep($GITHUB_WORKSPACE/**),mcp__sandbox__create_sandbox,mcp__sandbox__destroy_sandbox,mcp__sandbox__list_sandboxes,mcp__sandbox__get_session_info,mcp__sandbox__sandbox_exec,mcp__sandbox__sandbox_write_file,mcp__sandbox__sandbox_edit_file,mcp__sandbox__sandbox_read_file,mcp__sandbox__sandbox_list_files,mcp__sandbox__sandbox_install_packages,mcp__sandbox__sandbox_process_logs,mcp__sandbox__sandbox_process_kill,mcp__sandbox__eas_build,mcp__sandbox__eas_build_status,mcp__sandbox__eas_build_list,mcp__sandbox__simulator_start,mcp__sandbox__simulator_status,mcp__sandbox__simulator_stop,mcp__sandbox__simulator_screenshot,mcp__sandbox__simulator_ui,mcp__sandbox__simulator_tap,mcp__sandbox__simulator_type,mcp__sandbox__simulator_open,mcp__sandbox__simulator_boot_app,mcp__sandbox__simulator_install_build,mcp__sandbox__simulator_relaunch_app,mcp__sandbox__simulator_census_status,mcp__sandbox__simulator_app_state,mcp__sandbox__simulator_artifacts,mcp__sandbox__simulator_record,mcp__sandbox__github_comment_issue,mcp__sandbox__expo_skill,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue comment:*)" \
            --output-format stream-json --verbose \
            | tee "$RUNNER_TEMP/verify-run.jsonl" \
            | jq -r --unbuffered '
                if .type == "system" and .subtype == "init" then
                  "▶ session started — model \(.model // "?")"
                elif .type == "assistant" then
                  (.message.content[]? |
                    if .type == "text" and ((.text // "") | length) > 0 then "🤖 \(.text)"
                    elif .type == "tool_use" then "→ \(.name) \(.input | tostring | .[0:220])"
                    else empty end)
                elif .type == "user" then
                  (.message.content[]? | select(.type == "tool_result") |
                    "  ← \((.content | tostring) | .[0:220])")
                elif .type == "result" then
                  "✔ completed — \(((.duration_ms // 0) / 1000) | floor)s, \(.num_turns // "?") turn(s)\n===== FINAL RESULT =====\n\(.result // "(no result text)")"
                else empty end'

      # Raw engine transcript, kept like the code-review workflows keep
      # their run log — the console rendering above is lossy by design.
      - name: Upload run log
        if: always() && steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-run-log-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/verify-run.jsonl
          if-no-files-found: ignore
          retention-days: 14
