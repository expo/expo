# Issue/PR verification agent, triggered by a maintainer comment:
#   /verify           investigate the report and post findings with attested evidence.
#                     On an ISSUE this also opens a pull request when it can verify a
#                     fix; on a PULL REQUEST it reports only.
#   /verify --fix     also attempt a fix pull request (needed only on a pull request).
#   /verify --no-fix  report only, never open a pull request.
#
# The agent is headless Claude Code connected to the expo-sandbox-mcp server
# (hosted E2B sandboxes, proxied EAS builds, hosted iOS simulators). It
# reproduces the report where the hosted simulator can exhibit it, runs
# cold-launch censuses / behavioral checks / crash loops as the issue
# demands, and posts ONE findings comment whose evidence sections
# (screenshots, census tables) are composed and attested by the server.
#
# SECURITY POSTURE (mirrors expo-code-review-command.yml):
# - `issue_comment` is NOT fork-restricted: this always runs in base-repo
#   context with secrets. We check out ONLY the trusted base ref, never a PR
#   head; nothing from the issue/PR executes on this runner. Untrusted code
#   from repro repos executes only inside the MCP server's sandboxes — that
#   containment is the server's entire design.
# - The gate controls who triggers: the `if:` filters to maintainer
#   associations, and an authoritative permission check requires write
#   access or higher (author_association alone does not prove write).
# - The comment body reaches shell only via env.
# - The agent reads attacker-authored issue text, so it gets NO SHELL: every
#   invocation passes --disallowedTools Bash, which REMOVES the tool. An
#   allowlist alone does not — it pre-approves matching calls and leaves other
#   tools reachable, which is how this file once claimed a shell-free agent it
#   did not have. With Bash gone, nothing the agent invokes can expand
#   CLAUDE_CODE_OAUTH_TOKEN out of the step's environment. Its view of the
#   target arrives as files; it publishes only through the MCP server's
#   findings-comment tool, whose arguments are literal JSON.
# - The agent never pushes and never opens a pull request. In fix mode it
#   edits the trusted base checkout, and a later step — git and gh only, no
#   agent involvement — turns that edit into a PR behind a path denylist and a
#   size cap. MCP create_sandbox allowlisting is authorized by the gated
#   maintainer trigger itself (approval moves to the trigger, not skipped).
#
# SECRETS REQUIRED (repo settings):
# - EXPO_SANDBOX_MCP_TOKEN   long-lived bearer for the expo-sandbox-mcp PROD
#                            deployment, held by the expo-verification-bot
#                            service account. The agent NEVER sees it — the
#                            Mint scoped token step exchanges it for a
#                            one-sandbox, three-hour credential (sized to
#                            outlive the job; see timeout-minutes). The service
#                            account's stored Expo credential is what EAS
#                            builds bill; its stored GitHub PAT posts the
#                            findings comments (plain issues need Issues:
#                            Read and write on it).
# - CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN  REUSED from the AI code-review
#                            workflows — same engine (Claude Code CLI), one
#                            model credential to rotate. If usage ever needs
#                            separate attribution, split it back out.
# - EXPO_BOT_GITHUB_TOKEN    existing bot token, used only by fixed workflow
#                            steps (ack reaction, announce comment, context
#                            collection) — never placed in the agent's env.
name: Verify issue (command)

on:
  issue_comment:
    types: [created]
  # Quiet path. Dispatching from the Actions tab runs a verification that
  # posts NOTHING to the thread until the findings themselves — no eyes
  # reaction, no "started" comment, no failure notice. That matters on a
  # pull request, where every bot comment lands in a contributor's inbox
  # and an experiment that finds nothing should leave no trace at all.
  # workflow_dispatch is inherently gated: GitHub only lets accounts with
  # write access dispatch a workflow, which is the same bar the comment
  # path checks for explicitly.
  workflow_dispatch:
    inputs:
      target:
        description: "Issue or pull request number"
        required: true
        type: string
      fix:
        description: "Attempt a fix pull request (issues default to yes on the comment path; here it is explicit)"
        type: boolean
        default: false

# Scopes the automatic workflow token, which is what the AGENT step gets:
# issue comments yes, repository contents never. The agent therefore cannot
# push or write files even if an injected instruction tells it to — the
# boundary is the token's permissions, not a command-pattern allowlist.
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  verify:
    # Job-level, NOT workflow-level: a workflow-level group is claimed at run
    # creation — before the `if:` below skips the job — so any unrelated
    # comment on this issue would cancel an in-flight verification and strand
    # its sandboxes and EAS builds. cancel-in-progress:false queues a second
    # /verify instead of killing the first.
    concurrency:
      group: verify-${{ github.event.issue.number || inputs.target }}
      cancel-in-progress: false
    # Comments starting with /verify, on issues or PRs, from maintainer
    # associations. The authoritative write-access check is the step below.
    # (Runs are backed by the expo-verification-bot service account.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.comment.body, '/verify') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # ONE budget, in one place, and the ordering is the point:
    #   scoped-token TTL (180m) > job timeout (150m) > sum of the phase
    #   timeouts (90 + 15 + 30 = 135m) + setup.
    # Get it backwards and the credential dies mid-run — which is exactly what
    # happened when the phases were split in three against an unchanged
    # 70-minute token: up to 140 minutes of agent time on it, and the phase
    # most likely to find it dead was the last one, the only phase that posts
    # the findings and destroys the sandbox.
    # The MCP server TTL-reaps sandboxes server-side, so a timeout here
    # orphans nothing.
    #
    # Investigation was 60m and that was measurably too short: on 2026-08-11
    # #45314 and #48298 both died at exactly 3600s ("The investigation agent
    # exited 124" — timeout's own code), losing an hour of work and the EAS
    # builds already paid for. Both were build-heavy, which is the shape that
    # overruns: the session budget allows 5 builds at 10-20 minutes each, so
    # build wall-clock alone can approach 100 minutes. 90m covers a realistic
    # four-build run. A genuine five-build matrix is still at risk, and the
    # honest answer there is fewer arms, not more clock.
    timeout-minutes: 150
    continue-on-error: true
    # Resolved once, for both trigger paths, so no step has to know which
    # event it is running under.
    env:
      TARGET_NUMBER: ${{ github.event.issue.number || inputs.target }}
      TRIGGER_ACTOR: ${{ github.event.comment.user.login || github.actor }}
      QUIET: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # author_association MEMBER does not imply write on THIS repo; the
      # requirement is write access or higher, checked against the
      # collaborators permission API.
      - name: Require write access
        id: gate
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login || github.actor }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq .permission || echo none)
          case "$perm" in
            admin|maintain|write) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "/verify requires write access or higher; $ACTOR has: $perm"
              ;;
          esac

      # Comment body reaches shell only via env, never inline ${{ }}.
      #
      # Fix mode differs by target, because the two cases are not symmetric:
      #  - ISSUE: implicit. A verified fix is the point of investigating a bug
      #    report, and the change is authored against this repository's own
      #    trusted base checkout.
      #  - PULL REQUEST: explicit `--fix` only. The change under examination is
      #    already somebody's proposed fix, and on a fork PR the head is
      #    attacker-supplied; layering an agent-authored patch on top of it
      #    muddies authorship and review, so the default there is to report
      #    before/after and let the author act.
      # `--no-fix` forces a report-only run on an issue.
      - name: Parse command
        id: cmd
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          INPUT_FIX: ${{ inputs.fix }}
        run: |
          if [ "$QUIET" = "true" ]; then
            # Dispatch carries no comment, and nothing tells us whether the
            # number is an issue or a pull request — ask.
            IS_PR=$(gh api "repos/${{ github.repository }}/issues/$TARGET_NUMBER" --jq '.pull_request != null' 2>/dev/null || echo false)
            fix=$INPUT_FIX
          else
            line=$(printf '%s' "$COMMENT" | head -n1 | tr -d '\r')
            if [ "$IS_PR" = "true" ]; then fix=false; else fix=true; fi
            case " $line " in *" --fix "*) fix=true ;; esac
            case " $line " in *" --no-fix "*) fix=false ;; esac
          fi
          echo "fix=$fix" >> "$GITHUB_OUTPUT"
          echo "is_pr=$IS_PR" >> "$GITHUB_OUTPUT"
          echo "fix mode: $fix (target is $([ "$IS_PR" = true ] && echo 'a pull request' || echo 'an issue')${QUIET:+, quiet dispatch})"

      - name: Acknowledge
        if: steps.gate.outputs.ok == 'true' && env.QUIET != 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      # Watchable from the start: the Actions run streams the agent's live
      # progress, so the thread gets that link the moment work begins (the
      # findings comment lands separately when the investigation completes).
      - name: Announce run
        if: steps.gate.outputs.ok == 'true' && env.QUIET != 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
        run: |
          gh issue comment "$TARGET_NUMBER" -R "${{ github.repository }}" \
            --body "🔍 \`/verify\` started for @$TRIGGER_ACTOR — [watch the investigation run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Findings will be posted here when it completes."

      # Base ref only — the prompt file must come from the trusted branch,
      # and no PR-head code may ever run on this runner.
      - name: Checkout (base ref only — never the PR head)
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        if: steps.gate.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Pinned exactly, like the code-review workflows.
      - name: Install Claude Code CLI
        if: steps.gate.outputs.ok == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.212

      # The agent gets ZERO shell access (see the allowlist below), so its
      # view of the target arrives as files it can Read. This is what lets the
      # Bash surface go away: nothing the agent can invoke expands an
      # environment variable, so no injected instruction can print a
      # credential anywhere.
      - name: Collect target context
        id: ctx
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          IS_PR: ${{ steps.cmd.outputs.is_pr }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.verify-context"
          cd "$GITHUB_WORKSPACE/.verify-context"
          # `gh --json` emits COMPACT json: one enormous line. The agent's Read
          # pages by line, so a thread that exceeds its window becomes
          # unreachable past the first page — offsets cannot land inside a
          # single line. Pretty-print so paging works, and bound it the same
          # way the diff below is bounded, with the status in a header the
          # agent cannot read past.
          gh issue view "$TARGET_NUMBER" -R "${{ github.repository }}" \
            --comments --json number,title,state,labels,body,comments \
            | jq . > "$RUNNER_TEMP/full-target.json"
          t_lines=$(wc -l < "$RUNNER_TEMP/full-target.json" | tr -d ' ')
          t_bytes=$(wc -c < "$RUNNER_TEMP/full-target.json" | tr -d ' ')
          t_max_lines=1500
          head -n "$t_max_lines" "$RUNNER_TEMP/full-target.json" > "$RUNNER_TEMP/cut-target.json"
          k_lines=$(wc -l < "$RUNNER_TEMP/cut-target.json" | tr -d ' ')
          if [ "$k_lines" -lt "$t_lines" ]; then t_complete=NO; else t_complete=yes; fi
          if [ "$t_complete" = "yes" ]; then
            cp "$RUNNER_TEMP/full-target.json" target.json
          else
            # Truncated JSON does not parse, so hand it over as text with the
            # warning first and the comment count it should have had.
            {
              echo "*** TARGET CONTEXT TRUNCATED — complete: NO ***"
              echo "*** included $k_lines of $t_lines lines ($t_bytes bytes total). ***"
              echo "*** Later comments are NOT below; say so in your report if they matter. ***"
              echo
              cat "$RUNNER_TEMP/cut-target.json"
            } > target.json
          fi
          if [ "$IS_PR" = "true" ]; then
            # headRefOid/baseRefOid PIN the revision. Without them the diff
            # below and the checkout the agent makes later are two different
            # fetches of a MUTABLE ref: a contributor pushing mid-run makes the
            # agent reason from revision A, test revision B, and publish a
            # verdict about neither.
            gh pr view "$TARGET_NUMBER" -R "${{ github.repository }}" \
              --json number,title,state,headRefName,baseRefName,headRefOid,baseRefOid,files,body > pull-request.json
            head_oid=$(jq -r .headRefOid pull-request.json)
            base_oid=$(jq -r .baseRefOid pull-request.json)
            echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"
            echo "pinned PR revision: base $base_oid -> head $head_oid"
            # A huge diff must not blow the agent's context, but a SILENTLY
            # cut diff is worse than a big one: the agent would post a public
            # verdict built on it. Three rules make that impossible to miss:
            #
            #  1. Fetch in full first — piping into `head` would hide both a
            #     gh failure (the default run: shell has no pipefail) and the
            #     SIGPIPE that truncation itself causes.
            #  2. Bound by LINES as well as bytes, tighter than the agent's
            #     own read window (~2000 lines), so the file the agent gets
            #     always fits in ONE read. Nothing can hide below the fold.
            #  3. Put the status in a HEADER AT THE TOP, always — present even
            #     when the diff is complete. A trailing marker is unreachable:
            #     the agent reads from the top and stops long before the end.
            # Pinned to the two SHAs, not to `gh pr diff`, which re-resolves
            # the head every time it runs.
            gh api -H "Accept: application/vnd.github.v3.diff" \
              "repos/${{ github.repository }}/compare/$base_oid...$head_oid" \
              > "$RUNNER_TEMP/full.diff"
            max_bytes=400000
            max_lines=1500
            full_bytes=$(wc -c < "$RUNNER_TEMP/full.diff" | tr -d ' ')
            full_lines=$(wc -l < "$RUNNER_TEMP/full.diff" | tr -d ' ')
            head -c "$max_bytes" "$RUNNER_TEMP/full.diff" | head -n "$max_lines" > "$RUNNER_TEMP/cut.diff"
            kept_bytes=$(wc -c < "$RUNNER_TEMP/cut.diff" | tr -d ' ')
            kept_lines=$(wc -l < "$RUNNER_TEMP/cut.diff" | tr -d ' ')
            if [ "$kept_bytes" -lt "$full_bytes" ]; then complete=NO; else complete=yes; fi
            {
              echo "*** VERIFY DIFF HEADER — READ THIS FIRST ***"
              echo "*** complete: $complete"
              echo "*** included: $kept_lines of $full_lines lines, $kept_bytes of $full_bytes bytes"
              if [ "$complete" = "NO" ]; then
                echo "*** THIS IS A PARTIAL DIFF. Do NOT reason about the change from this file."
                echo "*** Clone the PR head inside the sandbox and read the files there instead,"
                echo "*** and say in your report that the provided diff was truncated."
              fi
              echo "*** END HEADER ***"
              echo
              cat "$RUNNER_TEMP/cut.diff"
            } > pull-request.diff
            # Same facts in JSON, so the agent can check them without paging.
            jq --argjson m "{\"complete\":$([ "$complete" = yes ] && echo true || echo false),\"includedLines\":$kept_lines,\"totalLines\":$full_lines,\"includedBytes\":$kept_bytes,\"totalBytes\":$full_bytes}" \
              '. + {diff: $m}' pull-request.json > pull-request.tmp.json
            mv pull-request.tmp.json pull-request.json
          fi
          ls -la

      # The long-lived secret never reaches the agent: it lives in THIS step's
      # env only, and is exchanged for a derived token bounded on every axis
      # that costs money or is publicly visible — TWO sandboxes, at most 5 EAS
      # builds, comments ONLY on the triggering thread, and a TTL that does not
      # outlive the job. The INVESTIGATION still gets exactly one: every
      # comparison it needs (before/after arms, a stock-template control) is
      # done by swapping the tree between submissions — verified in live runs,
      # where a three-arm boot-hang census ran in a single sandbox. The second
      # is earmarked for fix mode, where the agent clones this repository and
      # runs the changed package's own typecheck/lint/test before proposing a
      # pull request. It is separate because that install competes for memory
      # with the repro app the first sandbox is running, and because two of the
      # first three fix pull requests this workflow opened failed
      # check-packages on exactly the checks a package can run for itself.
      # Five builds because that is also the sandbox's own per-session quota,
      # so the token stops
      # being the binding limit. Consequence accepted: a sandbox that breaks
      # unrecoverably ends the run, and the maintainer re-triggers /verify.
      # These numbers and the prompt's stated budget must stay equal.
      # Server-side enforcement, not prompt text — the budgets are spent
      # transactionally and the comment target is checked per call.
      # Only the derived token is written to disk, so a config file read off
      # the runner — or a token echoed anywhere — buys that bounded set.
      # (Deriving in-process rather than passing a token between jobs is
      # deliberate: job outputs and artifacts are readable by anyone who can
      # read the run, which on a public repository is everyone.)
      - name: Mint scoped token
        if: steps.gate.outputs.ok == 'true'
        env:
          EXPO_SANDBOX_MCP_TOKEN: ${{ secrets.EXPO_SANDBOX_MCP_TOKEN }}
          MCP_URL: https://agile-minnow-543.convex.site
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
        run: |
          umask 077
          scoped=$(curl -sf -m 30 "$MCP_URL/tokens/scoped" \
            -H "Authorization: Bearer $EXPO_SANDBOX_MCP_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"sandboxBudget\":2,\"buildBudget\":5,\"ttlSeconds\":10800,\"commentTargets\":[\"${GITHUB_REPOSITORY}#${ISSUE_NUMBER}\"],\"name\":\"verify-run-${GITHUB_RUN_ID}\"}" \
            | jq -r '.token // empty')
          if [ -z "$scoped" ]; then
            echo "::error::Could not mint a scoped sandbox token"
            exit 1
          fi
          # Mask it too: a scoped token is cheap, not free.
          echo "::add-mask::$scoped"
          cat > "$RUNNER_TEMP/mcp.json" <<EOF
          {
            "mcpServers": {
              "sandbox": {
                "type": "http",
                "url": "$MCP_URL/mcp",
                "headers": { "Authorization": "Bearer $scoped" }
              }
            }
          }
          EOF

      # Fix mode ends in a push, and a push that cannot authenticate costs the
      # whole run: the first time this step's push was ever reached it died on
      # "could not read Username", after twelve minutes, a sandbox and two EAS
      # builds, with a findings comment already posted claiming a pull request
      # that did not exist. `--dry-run` performs the real connection, the real
      # authentication and the real ref negotiation, and writes nothing — so
      # this answers "can we push?" in seconds, before anything is spent.
      #
      # Its own step on purpose: "Run verification" holds NO GitHub token, and
      # that is a property worth keeping.
      - name: Preflight push credentials
        if: steps.gate.outputs.ok == 'true' && steps.cmd.outputs.fix == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          # No pipe here: `git ... | tail` would report tail's exit status and
          # the check would pass no matter what git did.
          if ! git push --dry-run origin "HEAD:refs/heads/verify-preflight-$GITHUB_RUN_ID"; then
            echo "::error::EXPO_BOT_GITHUB_TOKEN cannot push to this repository, so fix mode could not open a pull request. Fix the credential before re-running."
            exit 1
          fi
          echo "preflight: push credentials work; fix mode can open a pull request"

      - name: Run verification
        id: investigate
        if: steps.gate.outputs.ok == 'true'
        env:
          # Same credential the code-review workflows feed their Claude Code
          # engine — it holds a Claude Code OAuth token, hence this env var
          # (ANTHROPIC_API_KEY is for raw API keys).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN }}
          # NO GitHub token in this step at all: the agent has no shell and no
          # gh verb, so it needs none. The findings comment is posted by the
          # MCP server from its own stored PAT, whose arguments are literal
          # JSON — never a shell-expanded string.
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
          ISSUE_KIND: ${{ steps.cmd.outputs.is_pr == 'true' && 'pull request' || 'issue' }}
          REPO: ${{ github.repository }}
          # Pinned to Opus explicitly; override with a VERIFY_MODEL repo
          # variable (mirrors the code-review workflows' REVIEWER_MODEL).
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL || 'claude-opus-5' }}
          FIX_MODE: ${{ steps.cmd.outputs.fix }}
        # Comment-only is enforced structurally, not by command patterns —
        # patterns proved to be the wrong instrument twice (a `gh api` rule
        # permits -X POST; a `gh issue comment` rule permits
        # --body "$SOME_SECRET", which would print a credential into a public
        # comment). So:
        #   1. NO Bash tool: --disallowedTools Bash, which REMOVES it. An
        #      allowlist does not — `--allowedTools` pre-approves matching
        #      calls and leaves every other tool reachable, so this comment
        #      used to claim a property the file did not have. Verified by
        #      test: with only Read/Glob/Grep allowlisted, `echo hello` ran
        #      unprompted; with --disallowedTools Bash it fails closed. The
        #      agent having no shell is what stops anything it invokes from
        #      expanding CLAUDE_CODE_OAUTH_TOKEN out of this step's env, so
        #      the flag is load-bearing, not decorative.
        #   2. --strict-mcp-config: only the server in --mcp-config is
        #      reachable, never one inherited from a config file on the
        #      runner.
        #   3. Read/Glob/Grep scoped to the workspace — RUNNER_TEMP (holding
        #      the MCP config) is out of reach.
        #   4. No GitHub token in this step's environment.
        #   5. The MCP credential is server-scoped to a bounded sandbox
        #      budget with a TTL that outlives the phases (see Mint scoped
        #      token).
        # stream-json --verbose + a jq activity renderer, the same visibility
        # the code-review CLI gives its claude -p engine: every tool call and
        # assistant message lands in the Actions log live (which the announce
        # comment links), and the raw JSONL is uploaded as an artifact below.
        run: |
          prompt=$(cat .github/verify/prompt.md)
          set -o pipefail
          # The agent has no shell, so it cannot ask git what it is looking at.
          # Hand it the exact commit: without one, a citation of file:line is
          # unresolvable for a reader, and every permalink it writes would be a
          # branch URL that drifts off the lines it is pointing at.
          CHECKOUT_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
            # One entry per line so adding or removing a capability is a
            # one-line diff — this list IS the security boundary, and a
            # 1000-character string is not reviewable.
            TOOLS=(
              # Runner-side: read-only, scoped to the checkout. No Bash.
              #
              # The leading `//` is load-bearing: in a permission rule one `/`
              # anchors to the project root (so `/home/runner/...` resolves to
              # `$CWD/home/runner/...` and matches nothing), and only `//` means
              # an absolute filesystem path. $GITHUB_WORKSPACE already begins
              # with `/`, hence the extra one written here.
              "Read(/$GITHUB_WORKSPACE/**)"
              "Glob(/$GITHUB_WORKSPACE/**)"
              "Grep(/$GITHUB_WORKSPACE/**)"
              # Sandbox, EAS, and simulator work. Posting the comment and
              # destroying the sandbox are NOT here: they belong to the last
              # phase, after a reviewer has attacked the draft, and are added
              # to this list only by "Revise and post".
              "mcp__sandbox__create_sandbox"
              "mcp__sandbox__list_sandboxes"
              "mcp__sandbox__get_session_info"
              "mcp__sandbox__sandbox_exec"
              "mcp__sandbox__sandbox_write_file"
              "mcp__sandbox__sandbox_edit_file"
              "mcp__sandbox__sandbox_read_file"
              "mcp__sandbox__sandbox_list_files"
              "mcp__sandbox__sandbox_install_packages"
              "mcp__sandbox__sandbox_process_logs"
              "mcp__sandbox__sandbox_process_kill"
              "mcp__sandbox__eas_build"
              "mcp__sandbox__eas_build_status"
              "mcp__sandbox__eas_build_list"
              "mcp__sandbox__simulator_start"
              "mcp__sandbox__simulator_status"
              "mcp__sandbox__simulator_stop"
              "mcp__sandbox__simulator_screenshot"
              "mcp__sandbox__simulator_ui"
              "mcp__sandbox__simulator_tap"
              "mcp__sandbox__simulator_type"
              "mcp__sandbox__simulator_open"
              "mcp__sandbox__simulator_boot_app"
              "mcp__sandbox__simulator_install_build"
              "mcp__sandbox__simulator_relaunch_app"
              "mcp__sandbox__simulator_census_status"
              "mcp__sandbox__simulator_app_state"
              "mcp__sandbox__simulator_artifacts"
              "mcp__sandbox__simulator_record"
              "mcp__sandbox__expo_skill"
            )
            # Every run writes a draft and reads a review here, so this rule
            # is unconditional — unlike the checkout-wide one below, which is
            # the fix-mode capability and stays gated.
            TOOLS+=( "Edit(/$GITHUB_WORKSPACE/.verify-out/**)" )
            # Fix mode only: let the agent EDIT THE CHECKOUT, so the proposed
            # change is a real edit to real files rather than a hand-written
            # diff (far more reliable). Nothing on this runner ever executes
            # what it writes — the push step only runs git and gh — and the
            # denylist there refuses patches that touch automation.
            #
            # ONE rule, and it must say `Edit`: a `Write(...)` rule is not
            # consulted by file permission checks at all, and an `Edit(...)`
            # rule already covers every file-editing tool including Write.
            if [ "$FIX_MODE" = "true" ]; then
              TOOLS+=( "Edit(/$GITHUB_WORKSPACE/**)" )
            fi
            IFS=","; ALLOWED="${TOOLS[*]}"; unset IFS
          # The later phases reuse this exact string, so the security boundary
          # stays the single reviewable list above.
          echo "ALLOWED=$ALLOWED" >> "$GITHUB_ENV"
          # Preflight: prove the checkout is writable BEFORE spending the run.
          #
          # A wrong file rule is invisible to review — `Write(<abs>/**)` and
          # `Edit(/abs/**)` both read as correct and both grant nothing — and
          # it does not surface until the agent tries to edit, twelve minutes,
          # one sandbox and several EAS builds in. The sandbox budget is ONE
          # per run and cannot be replaced, so that discovery costs a full
          # re-trigger. This exercises the real $ALLOWED string through the
          # real CLI in the real working directory, so it also catches causes
          # nobody predicted: a change in how path rules are parsed, a deny
          # rule arriving in repo settings, a later edit to the pattern.
          # No --mcp-config: the MCP entries are simply unmatched allow rules
          # here, and starting the server for a canary write is waste.
          #
          # This is unconditional now. Even outside fix mode the run depends on
          # writes: the draft the reviewer reads, and the review the last phase
          # reads back. An un-writable .verify-out means no findings at all.
          #
          # It runs on $VERIFY_MODEL, not a cheaper pinned one. The canary used
          # claude-haiku-4-5-20251001 while the run used $VERIFY_MODEL, so it
          # was proving a credential/model path the run never takes: a token
          # with access to one but not the other fails here and blocks a run
          # that would have worked, which is exactly what happened on
          # 2026-08-11 after the CLAUDE_CODE_OAUTH_TOKEN secret was rotated.
          # One trivial call on the real model is worth less than one wasted
          # investigation.
          #
          # And it KEEPS THE CLI OUTPUT. Every cause — bad path rule, expired
          # token, model not available, API outage — lands as the same missing
          # file, so discarding stderr and then naming one of them was a guess
          # printed as a diagnosis. That guess sent a maintainer to debug path
          # rules that were correct. Report the symptom, show the output, let
          # the reader conclude.
          mkdir -p .verify-out && rm -f .verify-out/.permcheck
          claude -p "Write the single word ok to .verify-out/.permcheck. Say nothing else." \
            --model "$VERIFY_MODEL" \
            --disallowedTools Bash --strict-mcp-config \
            --allowedTools "$ALLOWED" > "$RUNNER_TEMP/permcheck.log" 2>&1 || true
          if [ ! -f .verify-out/.permcheck ]; then
            echo "::error::Preflight canary did not write .verify-out/.permcheck, so the run stopped before spending a sandbox. This is EITHER a file-permission rule that does not match OR the CLI failing to run at all (credential, model access, outage). The CLI output below says which:"
            sed -n '1,40p' "$RUNNER_TEMP/permcheck.log" || true
            echo "::error::--allowedTools was: $ALLOWED"
            exit 1
          fi
          rm -f .verify-out/.permcheck
          echo "preflight: .verify-out is writable${FIX_MODE:+, fix mode = $FIX_MODE}"
          # The renderer is COSMETIC and must never decide the step's fate.
          # It has now failed a completed investigation twice with
          # "jq: error: writing output failed: Broken pipe" — once as a fourth
          # pipe stage, once writing 14KB straight to the step log — and each
          # time pipefail turned a finished 12-25 minute run, with findings
          # written and the checkout edited, into a failure with all three
          # phases skipped. Rather than guess at the cause a third time: take
          # the AGENT's exit status through a file, let the pipeline's status
          # go, and judge the step on that plus the artifacts it produced.
          set +o pipefail
          rc_file="$RUNNER_TEMP/claude.rc"
          { timeout 5400 claude -p \
            --model "$VERIFY_MODEL" \
            "Repository: $REPO. Target: $ISSUE_KIND #$ISSUE_NUMBER. Triggered by maintainer @$TRIGGER_ACTOR. FIX MODE: $FIX_MODE (when true, and only if your fix is verified, edit the checkout in $GITHUB_WORKSPACE and write .verify-out/pr.md — see 'Fix mode' below; when false, describe the fix in your comment and change nothing). CHECKOUT: $REPO at commit $CHECKOUT_SHA — permalink any file you cite as https://github.com/$REPO/blob/$CHECKOUT_SHA/<path>#L<start>-L<end>. THIS PHASE DOES NOT PUBLISH: write your findings to .verify-out/findings.md and STOP — do not post, and do NOT destroy the sandbox. A reviewer who has not seen your reasoning will attack the draft, and you will get the chance to answer with the sandbox still alive.

          $prompt" \
            --mcp-config "$RUNNER_TEMP/mcp.json" --strict-mcp-config \
            --disallowedTools Bash \
            --allowedTools "$ALLOWED" \
            --output-format stream-json --verbose \
            ; echo $? > "$rc_file"; } \
            | tee "$RUNNER_TEMP/verify-run.jsonl" \
            | jq -rf .github/verify/render.jq || true
          set -o pipefail
          agent_rc=$(cat "$rc_file" 2>/dev/null || echo 1)
          # Do NOT exit here. A timeout kill (rc 124) still leaves a session to
          # resume and, since findings.md is written incrementally, usually a
          # report worth reviewing and posting. Exiting on rc first meant the
          # step died BEFORE capturing SESSION_ID below, so the later phases had
          # nothing to resume even when the draft was sitting on disk — an hour
          # of work reduced to an artifact nobody reads. Record the outcome,
          # finish gathering, and decide at the end.
          if [ "$agent_rc" != "0" ]; then
            echo "::warning::The investigation agent exited $agent_rc (124 = hit its time limit). Continuing to salvage whatever it wrote."
            echo "cut_short=true" >> "$GITHUB_OUTPUT"
          fi
          # Render the reviewer's copy FROM THE TRANSCRIPT, not by teeing the
          # live pipeline. A fourth stage gave jq somewhere new to fail: with
          # pipefail, an EPIPE on its last write fails the step — so a run
          # whose investigation completed, wrote findings.md and edited the
          # checkout was thrown away at the final byte, 25 minutes and two EAS
          # builds in, before any of the three phases could post it.
          jq -rf .github/verify/render.jq \
            < "$RUNNER_TEMP/verify-run.jsonl" > .verify-out/run-log.txt || true
          # A silently un-writable checkout is the failure mode this whole
          # feature had on its first run: fix mode was on, the agent did the
          # work, every Edit was refused, and the step still exited 0 with an
          # empty diff. Refused writes are never acceptable — fail the run so
          # the cause is visible instead of looking like "the agent chose not
          # to propose a change".
          if grep -q 'requested permissions to write' "$RUNNER_TEMP/verify-run.jsonl"; then
            echo "::error::Writes were denied during the investigation — the --allowedTools file rules are not matching."
            exit 1
          fi
          if [ ! -s .verify-out/findings.md ]; then
            echo "::error::The investigation wrote no .verify-out/findings.md, so there is nothing to review or post."
            exit 1
          fi
          echo "findings=true" >> "$GITHUB_OUTPUT"
          # The last phase resumes THIS session, so it keeps the whole
          # investigation in context and can still drive the live sandbox.
          # Without that the reviewer's objections would be unanswerable.
          # `first(inputs)` and NOT `jq ... | head -n1`. Nearly every line of
          # the transcript carries a session_id, so that jq keeps producing
          # after head has read its one line and exited — and every write past
          # that point is an EPIPE. Under this step's pipefail (and bash -e on
          # the assignment) it killed the step with jq's exit 2, AFTER a
          # complete investigation had written findings.md and left its
          # sandbox up. It is a race, so it spared short runs and took the
          # long ones — the expensive ones. first() short-circuits: jq stops
          # at the first match, exits 0, and there is no pipe to break.
          SESSION_ID=$(jq -rn 'first(inputs | select(.session_id != null) | .session_id)' "$RUNNER_TEMP/verify-run.jsonl")
          if [ -z "$SESSION_ID" ] || [ "$SESSION_ID" = "null" ]; then
            echo "::error::Could not read a session id from the run transcript; the revise phase has nothing to resume."
            exit 1
          fi
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"

      # An agent is a poor reviewer of its own conclusion. The draft that
      # attached two screenshots of an unaffected platform labelled them
      # "iOS never takes the android_res branch" — it already knew they proved
      # nothing. So the reviewer here is a SEPARATE process with a fresh
      # context: it reads the draft and the run log as a stranger would, and
      # cannot be carried along by reasoning it never did.
      #
      # It has no sandbox, no MCP, no network and no way to publish. Its only
      # writable path is the review file itself.
      #
      # SEARCH is scoped to .verify-out and .verify-context; READ is not. Given
      # Glob/Grep over the whole monorepo and "find the moment in the run log
      # that establishes each claim", the reviewer spent longer than the
      # investigation it was reviewing — 13+ minutes against 9m17s — and hit
      # its timeout. It can still open any path the findings cite, which is
      # what checking a citation actually needs; what it can no longer do is
      # go exploring a very large tree.
      - name: Adversarial review of the draft findings
        if: steps.gate.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN }}
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
          ISSUE_KIND: ${{ steps.cmd.outputs.is_pr == 'true' && 'pull request' || 'issue' }}
          REPO: ${{ github.repository }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL || 'claude-opus-5' }}
        run: |
          set -o pipefail
          critic=$(cat .github/verify/critic.md)
          set +o pipefail
          rc_file="$RUNNER_TEMP/critic.rc"
          { timeout 900 claude -p \
            --model "$VERIFY_MODEL" \
            "Repository: $REPO. Target: $ISSUE_KIND #$ISSUE_NUMBER. The draft is .verify-out/findings.md and the run that produced it is .verify-out/run-log.txt. Write your review to .verify-out/review.md.

          $critic" \
            --disallowedTools Bash --strict-mcp-config \
            --allowedTools "Read(/$GITHUB_WORKSPACE/**),Glob(/$GITHUB_WORKSPACE/.verify-out/**),Glob(/$GITHUB_WORKSPACE/.verify-context/**),Grep(/$GITHUB_WORKSPACE/.verify-out/**),Grep(/$GITHUB_WORKSPACE/.verify-context/**),Edit(/$GITHUB_WORKSPACE/.verify-out/review.md)" \
            --output-format stream-json --verbose \
            ; echo $? > "$rc_file"; } \
            | tee "$RUNNER_TEMP/verify-critic.jsonl" \
            | jq -rf .github/verify/render.jq || true
          set -o pipefail
          if [ ! -s .verify-out/review.md ]; then
            echo "::error::The reviewer produced no .verify-out/review.md."
            exit 1
          fi

      # Back to the investigator, with its context and its sandbox intact.
      # This is the only phase that can publish, and the only one that can
      # tear the sandbox down — both capabilities are added here and nowhere
      # else.
      - name: Revise and post
        if: steps.gate.outputs.ok == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_EXPO_OSS_API_TOKEN }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL || 'claude-opus-5' }}
          # Via env, never inline ${{ }} — the same discipline the comment body
          # follows two steps down, applied to every value that reaches a shell.
          SESSION_ID: ${{ steps.investigate.outputs.session_id }}
          CUT_SHORT: ${{ steps.investigate.outputs.cut_short }}
        run: |
          set -o pipefail
          review=$(cat .verify-out/review.md)
          set +o pipefail
          rc_file="$RUNNER_TEMP/revise.rc"
          { timeout 1800 claude -p --resume "$SESSION_ID" \
            "${CUT_SHORT:+YOUR INVESTIGATION WAS CUT SHORT — it hit its time limit rather than finishing, so the draft you are about to revise is whatever you had written by then. Do not present it as a completed investigation: say in the result that the run was cut short, name what you had established and what you never got to, and drop any claim the draft states more confidently than the evidence supports. }A reviewer read your draft and the log of this run WITHOUT seeing your reasoning, and tried to break it. Their review follows. Treat it as a colleague's objections, not as orders: answer every MUST-FIX, and where you disagree, say so in the findings with your reason rather than silently ignoring it. The sandbox is still alive — if an objection can be settled by measuring again, measure again instead of arguing. Drop any evidence they show supports no claim, and correct anything they show you asserted without checking.

          Then, and only then: post the findings with mcp__sandbox__github_comment_issue, write .verify-out/pr.md if fix mode applies, and destroy the sandbox with mcp__sandbox__destroy_sandbox before you finish. Destroy it even if posting fails.

          --- REVIEW ---
          $review" \
            --mcp-config "$RUNNER_TEMP/mcp.json" --strict-mcp-config \
            --disallowedTools Bash \
            --allowedTools "$ALLOWED,mcp__sandbox__github_comment_issue,mcp__sandbox__destroy_sandbox" \
            --output-format stream-json --verbose \
            ; echo $? > "$rc_file"; } \
            | tee "$RUNNER_TEMP/verify-revise.jsonl" \
            | jq -rf .github/verify/render.jq || true
          set -o pipefail
          revise_rc=$(cat "$rc_file" 2>/dev/null || echo 1)
          if [ "$revise_rc" != "0" ]; then
            echo "::error::The revise-and-post phase exited $revise_rc."
            exit 1
          fi

      # The findings are public now, and they name the revision they tested.
      # If the contributor pushed while we worked, that verdict is about a
      # revision the PR no longer has — say so on the thread rather than
      # leaving a stale conclusion standing unqualified.
      - name: Note if the PR moved under the run
        if: steps.gate.outputs.ok == 'true' && steps.cmd.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          TESTED: ${{ steps.ctx.outputs.head_oid }}
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          now=$(gh pr view "$ISSUE_NUMBER" -R "${{ github.repository }}" --json headRefOid --jq .headRefOid)
          if [ -n "$TESTED" ] && [ -n "$now" ] && [ "$now" != "$TESTED" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ This pull request was updated while \`/verify\` was running. The findings above describe \`${TESTED:0:12}\`; the head is now \`${now:0:12}\`. Re-run \`/verify\` to check the current revision. [Run log]($RUN_URL)"
            echo "PR head moved during the run: $TESTED -> $now"
          else
            echo "PR head unchanged during the run ($TESTED)"
          fi

      # Fix mode: turn the agent's verified edit into a pull request.
      #
      # This step runs NO agent instructions and executes NO agent code — only
      # git and gh, on the edit already sitting in the checkout. What it does
      # enforce is the denylist: paths where a patch stops being reviewable
      # code and becomes control over automation, secrets, or dependency
      # resolution. Everything else is ordinary code for a human to review,
      # and the PR is labeled and bannered so nobody mistakes it for reviewed
      # work. Nothing auto-merges; branch protection and CODEOWNERS still
      # apply, and CI on the PR runs it exactly as it runs any contributor's.
      - name: Open fix pull request
        if: steps.gate.outputs.ok == 'true' && steps.cmd.outputs.fix == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          # Never commit the context we handed the agent or its scratch output.
          printf '.verify-context/\n.verify-out/\n' >> .git/info/exclude
          git add -A
          # Content, NOT the path list. The agent has no Bash, so it cannot
          # DELETE a file — only empty one. When a run for #48029 verified a
          # candidate fix, found it caused a regression and withdrew it, the
          # empty file it had created stayed staged as a 0-byte addition. That
          # made --name-only non-empty, so this step opened a pull request the
          # agent had explicitly refused, took its title from the first line of
          # pr.md (which read "DO NOT OPEN — no fix is proposed"), and then
          # announced "Opened … with the verified fix". numstat counts lines, so
          # an orphan like that no longer manufactures a change.
          changed=$(git diff --cached --numstat | awk '($1 + $2) > 0 { print $3 }')
          # An explicit refusal is honoured before anything else. The agent's
          # only channel used to be the PR title; now it can say so and be
          # heard. (Both spellings, because the model reaches for either.)
          declined=no
          if [ -s .verify-out/pr.md ] && head -n1 .verify-out/pr.md \
            | grep -qiE 'do not open|no (pull request|pr) should'; then
            declined=yes
          fi
          if [ "$declined" = "yes" ] || [ -z "$changed" ]; then
            if [ "$declined" = "yes" ]; then
              # Say nothing here. The agent decided this, and the prompt
              # requires it to say so in the findings comment it just posted,
              # so a second comment restating the same reasoning is pure
              # duplication in a thread other people are subscribed to.
              # Observed on #48780: findings landed at 21:43:43 and this
              # comment repeated the withdrawal 16 seconds later.
              #
              # The rule: the workflow comments only about outcomes the AGENT
              # could not have stated itself — a pull-request URL it never
              # sees, a denylist or size refusal made after it stopped, a push
              # that failed. Its own decisions are its own to report.
              echo "::notice::The run declined to open a pull request; its reasoning is in the findings comment."
              sed -n '2,12p' .verify-out/pr.md | tr -d '\r' | sed '/^$/d' | head -c 900
            else
              gh issue comment "$ISSUE_NUMBER" --body "🔧 \`/verify --fix\` ran but proposed no code change — see the [findings comment and run log]($RUN_URL)."
            fi
            exit 0
          fi
          # DENYLIST — a patch touching these is refused outright.
          #  .github/**            workflows, actions, CODEOWNERS: changing what CI runs
          #  .expo-code-review/**  the other automation's config, incl. its auth tokenEnv
          #  scripts/**            scripts CI executes
          #  lockfiles             unreviewable in practice, and a supply-chain swap
          #  .npmrc/.yarnrc*       registry redirection
          #  AGENTS.md/CLAUDE.md   instructions future agent runs will read
          #  keys/certs            no legitimate fix ships these
          denied=$(printf '%s\n' "$changed" | grep -E \
            -e '^\.github/' \
            -e '^\.expo-code-review/' \
            -e '^scripts/' \
            -e '(^|/)(yarn\.lock|package-lock\.json|pnpm-lock\.yaml|bun\.lockb?|Gemfile\.lock|Podfile\.lock|Cargo\.lock)$' \
            -e '(^|/)\.npmrc$' -e '(^|/)\.yarnrc(\.yml)?$' \
            -e '(^|/)(AGENTS|CLAUDE)\.md$' \
            -e '\.(pem|key|p12|keystore|mobileprovision)$' || true)
          if [ -n "$denied" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$(printf '⛔ \`/verify --fix\` refused to open a pull request: the proposed change touches paths that are off-limits to an automated patch (automation, lockfiles, or agent instructions):\n\n```\n%s\n```\n\nThe findings comment still stands; a human can apply the change deliberately. [Run log](%s)' "$denied" "$RUN_URL")"
            echo "::error::Denylisted paths in proposed fix:"; printf '%s\n' "$denied"
            exit 1
          fi
          # A fix should be small. A sprawling diff is a signal, not a fix.
          files=$(printf '%s\n' "$changed" | wc -l | tr -d ' ')
          lines=$(git diff --cached --numstat | awk '{a+=$1; d+=$2} END {print a+d}')
          if [ "$files" -gt 20 ] || [ "${lines:-0}" -gt 600 ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⛔ \`/verify --fix\` refused to open a pull request: the proposed change is too large for an automated patch ($files files, $lines lines). The findings comment still stands. [Run log]($RUN_URL)"
            exit 1
          fi
          title=$(head -n1 .verify-out/pr.md 2>/dev/null | sed 's/^#\+ *//')
          [ -n "$title" ] || title="Fix for #$ISSUE_NUMBER (verified by /verify)"
          branch="verify/${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git -c user.name='expo-bot' -c user.email='expo-bot@users.noreply.github.com' \
            commit -q -m "$title" -m "Verified by /verify for #$ISSUE_NUMBER. Run: $RUN_URL"
          # The checkout runs with persist-credentials: false, so git has no
          # credentials of its own. `AUTHORIZATION: bearer <token>` used to be
          # supplied here by hand; GitHub's git endpoint accepts that for App
          # installation tokens but rejects it for a PAT, and a rejected header
          # makes git fall back to prompting for a username on a runner that
          # has no terminal — "could not read Username", exit 128. gh's own
          # credential helper sends the form GitHub actually accepts.
          gh auth setup-git
          # Push to the BOT'S FORK, not a branch on this repository.
          #
          # A pull request whose head is a fork runs CI in GitHub's restricted
          # regime: no secrets on the runner and a read-only GITHUB_TOKEN. A
          # same-repo branch gets the full secret environment — sdk.yml sets
          # TURBO_TOKEN at workflow scope and check-packages runs `test`, so a
          # same-repo verify branch means jest executes agent-authored code
          # (a fix legitimately ships its own test file) next to a live secret.
          # Nothing here has earned that, and forking costs us nothing: the
          # runners are ephemeral and GitHub-hosted, so the restricted regime
          # is exactly the posture this repository already grants every
          # drive-by contributor.
          #
          # Falling back to a same-repo branch is deliberate and VISIBLE.
          # Losing a verified fix over fork plumbing would be the worse
          # failure, so the push still happens — but the pull request itself
          # carries a note saying so, because a silent downgrade of a security
          # property is how it stays downgraded, and a ::warning:: buried in a
          # run log is not something a reviewer of that PR will ever see.
          fork_owner=$(gh api user --jq .login 2>/dev/null || true)
          fork=""
          if [ -n "$fork_owner" ]; then
            fork="$fork_owner/${GITHUB_REPOSITORY#*/}"
            if ! gh repo view "$fork" >/dev/null 2>&1; then
              # --default-branch-only keeps the fork small. Forking is async,
              # so wait for it to become addressable before pushing into it.
              gh repo fork "$GITHUB_REPOSITORY" --clone=false --default-branch-only >/dev/null 2>&1 || true
              for _ in $(seq 1 30); do
                gh repo view "$fork" >/dev/null 2>&1 && break
                sleep 2
              done
            fi
            gh repo view "$fork" >/dev/null 2>&1 || fork=""
          fi
          if [ -n "$fork" ] && git push -q "https://github.com/$fork.git" "HEAD:refs/heads/$branch"; then
            head_ref="$fork_owner:$branch"
          else
            if [ -n "$fork" ]; then
              echo "::warning::push to fork $fork failed; falling back to a same-repo branch"
            else
              echo "::warning::could not resolve or create the bot fork; falling back to a same-repo branch"
            fi
            fork=""
            if ! git push -q origin "HEAD:refs/heads/$branch"; then
              gh issue comment "$ISSUE_NUMBER" --body "⛔ \`/verify --fix\` verified a fix but could not push the branch, so no pull request was opened. The findings comment still stands and the change is described there. [Run log]($RUN_URL)"
              echo "::error::git push failed; no pull request was opened."
              exit 1
            fi
            head_ref="$branch"
          fi
          {
            echo "> [!WARNING]"
            echo "> **Agent-authored and NOT human-reviewed.** An automated \`/verify --fix\` run"
            echo "> for #$ISSUE_NUMBER wrote this change and verified it in a sandbox; the"
            echo "> reasoning and evidence are in the findings comment on that issue."
            echo "> Review it as you would any external contribution."
            echo ""
            echo "Requested by @$TRIGGER_ACTOR · [investigation run]($RUN_URL) · refs #$ISSUE_NUMBER"
            if [ -z "$fork" ]; then
              echo ""
              echo "> [!NOTE]"
              echo "> This branch lives on \`$GITHUB_REPOSITORY\` rather than the bot's fork,"
              echo "> because the fork push failed. A fork pull request runs CI without"
              echo "> secrets; this one runs with them, over agent-authored code. Treat it"
              echo "> accordingly, and see the run log for why the fork was unavailable."
            fi
            echo ""
            tail -n +2 .verify-out/pr.md 2>/dev/null || echo "_No description was provided by the run._"
          } > "$RUNNER_TEMP/pr-body.md"
          # The branch is pushed at this point, so a failure here must not
          # vanish: the thread would otherwise keep the findings comment with
          # no word on what became of the fix.
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$head_ref" --title "$title" \
            --body-file "$RUNNER_TEMP/pr-body.md" --label "agent-authored" 2>/dev/null \
            || gh pr create --repo "$GITHUB_REPOSITORY" --head "$head_ref" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md") || {
            gh issue comment "$ISSUE_NUMBER" --body "⛔ \`/verify --fix\` pushed the verified fix to \`$head_ref\` but could not open a pull request. The branch is there for a maintainer to open by hand; the findings comment describes the change. [Run log]($RUN_URL)"
            echo "::error::gh pr create failed; the branch $branch was pushed but no pull request was opened."
            exit 1
          }
          gh issue comment "$ISSUE_NUMBER" --body "🔧 Opened $url with the verified fix — agent-authored, unreviewed. [Investigation run]($RUN_URL)"

      # Last line of defence against a total loss. `if: always()` genuinely
      # runs on step failure AND on cancellation — verified on real runs
      # (31505614243 failed, 31463049146 cancelled; the upload succeeded in
      # both) — so saving what EXISTS was never the problem. The problem is
      # that findings.md is written once, at the end, and a killed run leaves
      # nothing to save: an expo-camera investigation worked continuously for
      # its full hour, spent 4 EAS builds and 60 screenshots, and its artifact
      # held 2.2MB of transcript and no report.
      #
      # The transcript does hold the substance, just not in a form anyone
      # reads. So when there is no findings.md, render the agent's own running
      # narrative out of it. On that run the salvage recovers "reproduced
      # twice at cycle 6, with a clean control arm", "the patch never reached
      # the build — both binaries are byte-identical", and "the JS thread never
      # stalled while the display froze — that isolates the block to the UI
      # thread". That is a real handoff to a maintainer instead of silence.
      - name: Salvage a partial report if the run died before writing one
        id: salvage
        if: always() && steps.gate.outputs.ok == 'true'
        run: |
          set -o pipefail
          mkdir -p .verify-out
          if [ -s .verify-out/findings.md ]; then
            echo "findings.md exists; nothing to salvage"
            exit 0
          fi
          t="$RUNNER_TEMP/verify-run.jsonl"
          if [ ! -s "$t" ]; then
            echo "no transcript either; nothing to salvage"
            exit 0
          fi
          {
            echo "# Partial findings (salvaged from the run transcript)"
            echo
            echo "This run did not finish, so it never wrote its report. What follows is"
            echo "the investigating agent's own running narrative, extracted from the"
            echo "transcript in order. It is NOT a verdict and has NOT been reviewed —"
            echo "treat it as notes from an interrupted session."
            echo
            jq -r 'select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text' "$t" \
              | grep -v '^[[:space:]]*$' | sed 's/^/- /'
          } > .verify-out/partial-findings.md || true
          if [ -s .verify-out/partial-findings.md ]; then
            echo "salvaged=true" >> "$GITHUB_OUTPUT"
            echo "salvaged $(wc -l < .verify-out/partial-findings.md) lines into .verify-out/partial-findings.md"
          fi

      # Raw engine transcript, kept like the code-review workflows keep
      # their run log — the console rendering above is lossy by design.
      - name: Upload run log
        if: always() && steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-run-log-${{ env.TARGET_NUMBER }}
          # All three phases, plus the draft and the review that passed
          # between them — the review is deliberately not published to the
          # thread, so this artifact is where it can be audited.
          path: |
            ${{ runner.temp }}/verify-run.jsonl
            ${{ runner.temp }}/verify-critic.jsonl
            ${{ runner.temp }}/verify-revise.jsonl
            .verify-out/findings.md
            .verify-out/review.md
            .verify-out/partial-findings.md
          if-no-files-found: ignore
          retention-days: 14

      # The announce comment promises "findings will be posted here when it
      # completes". Every path that breaks that promise ends here.
      #
      # Without this, a failure anywhere — CLI install, token mint, context
      # collection, any of the three agent phases, a jq error — skips the
      # remaining steps (a condition with no status function carries an
      # implicit success()), and the thread keeps a "started" comment forever
      # with no result. The job also runs continue-on-error, so nothing else
      # signals it either.
      - name: Report a run that did not finish
        if: always() && steps.gate.outputs.ok == 'true' && env.QUIET != 'true' && (failure() || cancelled())
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # job.status, NOT cancelled(): status check functions are valid only
          # in an `if:`, and one in an `env:` makes the whole workflow file
          # invalid — GitHub then refuses to run it at all, including for the
          # issue_comment trigger.
          JOB_STATUS: ${{ job.status }}
          SALVAGED: ${{ steps.salvage.outputs.salvaged }}
        run: |
          case "$JOB_STATUS" in
            cancelled) outcome="was cancelled" ;;
            *) outcome="failed" ;;
          esac
          # Point at the salvage when there is one. An interrupted run often
          # established real things before it died, and a maintainer should be
          # told where they are rather than left to assume nothing survived.
          extra=""
          if [ "$SALVAGED" = "true" ]; then
            extra=" Partial notes from the interrupted session were recovered from the transcript and attached to the run as \`partial-findings.md\` — unreviewed, not a verdict, but they may save repeating the work."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ \`/verify\` $outcome before it could post findings — nothing here is a verdict on the report.$extra [Run log]($RUN_URL) has the details, and the run can be re-triggered with \`/verify\`."
