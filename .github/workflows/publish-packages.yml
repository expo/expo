name: Release Packages

on:
  push:
    branches:
      - main
      - sdk-58
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        default: canary
        options:
          - canary
          - sync-published-packages
      dry-run:
        description: Validate the sync without changing npm tags or www
        type: boolean
        default: true
  schedule:
    - cron: 0 1 * * * # Nightly at 1:00 AM UTC

permissions: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: expo
  RCT_HERMES_V1_ENABLED: "1"
  NPM_CONFIG_PROVENANCE: "true"

jobs:
  stable-mode:
    name: Select stable release mode
    if: github.repository == 'expo/expo'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sync: ${{ steps.policy.outputs.sync }}
      canary: ${{ steps.policy.outputs.canary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: policy
        name: Read branch policy from expo.json
        run: |
          jq -r --arg branch "$GITHUB_REF_NAME" '
            .branches[$branch] //
              (if $branch | test("^sdk-[0-9]+$") then .sdkBranchDefaults else {} end) |
            "stable=\((.publish // "") != "")",
            "sync=\(.publish == "latest")",
            "canary=\((.canary // "") != "")"
          ' .changeset/expo.json >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        if: github.event_name == 'push' && steps.policy.outputs.stable == 'true'
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push' && steps.policy.outputs.stable == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - id: mode
        name: Select version or publish
        if: github.event_name == 'push' && steps.policy.outputs.stable == 'true'
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo 'mode=version' >> "$GITHUB_OUTPUT"
          else
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm exec changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
            if jq -e '[.plan[]?[]?] | length > 0' "$RUNNER_TEMP/publish-plan.json" >/dev/null; then
              echo 'mode=publish' >> "$GITHUB_OUTPUT"
            else
              echo 'No unpublished package versions found; skipping stable publication.'
              echo 'mode=noop' >> "$GITHUB_OUTPUT"
            fi
          fi

  stable-version:
    name: Create or update version PR
    needs: stable-mode
    if: needs.stable-mode.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_OPTIONAL_LOCKS: "0"
    concurrency:
      group: publish-packages-version-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: Changesets automatically deepens the clone for older changeset entries.
          fetch-depth: 100
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prerequisites
        run: |
          pnpm turbo run build --filter=expotools...
          rm -f .git/index.lock
      - name: Create release PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: pnpm expotools version-packages
          commit-message: Version packages (${{ github.ref_name }})
          pr-title: Version packages (${{ github.ref_name }})
          pr-base-branch: ${{ github.ref_name }}
          push-with-git-cli: true

  stable-publish:
    name: Publish stable packages
    needs: stable-mode
    if: needs.stable-mode.outputs.mode == 'publish'
    runs-on:
      group: macos-publishing
    timeout-minutes: 300
    environment: npm-publish-stable
    concurrency:
      group: publish-packages-stable-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Snapshot ongoing Android precompilation
        id: android-precompile-runs
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Snapshot before waiting on anything, so later runs don't extend the wait.
          run_ids=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow changesets-precompile-android.yml \
            --branch "changeset-release/$GITHUB_REF_NAME" \
            --limit 10 \
            --json databaseId,status \
            --jq '[.[] | select(.status != "completed") | .databaseId] | join(" ")')
          echo "run-ids=$run_ids" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NOTE: The version-commit safeguard compares HEAD against HEAD^.
          fetch-depth: 2
      - run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app
      - run: echo "$(pwd)/bin" >> "$GITHUB_PATH"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Expo Tools and workspace dependencies
        run: pnpm turbo run build --filter=expotools...

      - name: Install EAS CLI
        id: eas-cli
        timeout-minutes: 5
        continue-on-error: true
        run: npm install --global eas-cli@^24.8.0

      - name: Wait for ongoing EAS precompilation
        if: steps.eas-cli.outcome == 'success'
        shell: bash
        timeout-minutes: 90
        continue-on-error: true
        working-directory: apps/expo-workflow-testing
        env:
          EXPO_TOKEN: ${{ secrets.EAS_BUILD_BOT_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          runs_file="$RUNNER_TEMP/precompile-runs.json"

          # Snapshot before waiting, so later runs don't extend the wait.
          eas workflow:runs \
            --workflow changesets-precompile-ios.yml \
            --limit 10 --json > "$runs_file" || echo '[]' > "$runs_file"

          ongoing_run_ids=$(jq -r '
            .[] | select(.status | IN("SUCCESS", "FAILURE", "CANCELED") | not) | .id
          ' "$runs_file")

          for run_id in $ongoing_run_ids; do
            echo "Waiting for EAS precompile run $run_id"
            eas workflow:status "$run_id" --wait --non-interactive ||
              echo "::warning::Run $run_id did not succeed; continuing with local precompilation."
          done

      - name: Wait for ongoing Android precompilation
        if: steps.android-precompile-runs.outputs.run-ids != ''
        shell: bash
        timeout-minutes: 90
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ steps.android-precompile-runs.outputs.run-ids }}
        run: |
          for run_id in $RUN_IDS; do
            echo "Waiting for Android precompile run $run_id"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null ||
              echo "::warning::Run $run_id did not succeed; continuing with local precompilation."
          done

      - name: Publish with Changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          publish-script: pnpm expotools publish-packages

  sync-published-packages:
    name: Sync published packages
    needs: [stable-mode, stable-publish]
    if: >-
      !cancelled() && needs.stable-mode.outputs.sync == 'true' &&
      (needs.stable-publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-published-packages'))
    # GitHub-hosted, not Blacksmith: `npm dist-tag add` authenticates with npm trusted publishing
    # (OIDC), which npm only supports on GitHub-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      # All SDK branches update the same versions document.
      group: sync-published-packages
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@^11.21.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=expotools...
      # Both syncs retry every minute until they succeed or the job times out. Every write they make
      # (dist-tags, native modules, versions) is idempotent, so retrying after any failure is safe.
      - name: Sync staging versions from this SDK commit
        run: |
          attempt=1
          until pnpm expotools sync-published-packages --env staging ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}; do
            echo "::warning::Staging sync attempt $attempt failed; retrying in 1 minute."
            sleep 60
            attempt=$((attempt + 1))
          done
        env:
          EXPO_VERSIONS_SECRET: ${{ secrets.EXPO_VERSIONS_SECRET }}
          EXPO_SDK_NATIVE_MODULES_SECRET: ${{ secrets.EXPO_SDK_NATIVE_MODULES_SECRET }}
      - name: Sync production versions from this SDK commit
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/sync-production.log"
          attempt=1
          until pnpm expotools sync-published-packages --env production ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }} 2>&1 | tee "$log"; do
            # Freshly published versions take a minute or so to show up in `npm view`; flag
            # anything else so it stands out in the run summary.
            if grep -qE 'is not published on public npm|E404' "$log"; then
              echo "Production sync attempt $attempt: published versions aren't on npm yet; retrying in 1 minute."
            else
              echo "::warning::Production sync attempt $attempt failed with an unexpected error; retrying in 1 minute."
            fi
            sleep 60
            attempt=$((attempt + 1))
          done
        env:
          EXPO_VERSIONS_SECRET: ${{ secrets.EXPO_VERSIONS_SECRET }}
          EXPO_SDK_NATIVE_MODULES_SECRET: ${{ secrets.EXPO_SDK_NATIVE_MODULES_SECRET }}

  canary-publish:
    name: Publish canary packages
    needs: stable-mode
    if: >-
      needs.stable-mode.outputs.canary == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation != 'sync-published-packages'))
    runs-on:
      group: macos-publishing
    timeout-minutes: 180
    environment: npm-publish-canary
    concurrency:
      group: publish-packages-canary-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app
      - run: echo "$(pwd)/bin" >> "$GITHUB_PATH"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Expo Tools and workspace dependencies
        run: pnpm turbo run build --filter=expotools...
      - name: Check pending changesets
        id: changesets
        if: github.event_name == 'schedule'
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets. Skipping the nightly canary."
          fi
      - name: Publish canaries
        if: github.event_name != 'schedule' || steps.changesets.outputs.pending == 'true'
        # Scheduled runs are temporarily dry-run while the Changesets canary flow is validated.
        run: pnpm expotools publish-canary ${{ github.event_name == 'schedule' && '--dry-run' || '' }}
        env:
          FORCE_COLOR: "2"
      - uses: ./.github/actions/slack-notify
        if: failure() && github.event_name == 'schedule'
        with:
          webhook: ${{ secrets.slack_webhook_api }}
          author_name: Publish Packages
          fields: job,message,author,took
