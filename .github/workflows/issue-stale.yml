name: Close inactive issues
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  close-issues:
    if: github.repository == 'expo/expo'
    runs-on: ubuntu-24.04
    # actions/stale labels and closes issues with the default GITHUB_TOKEN, so it needs
    # `issues: write` stated explicitly. It worked until now only because the repository
    # default was "read and write", which we are moving to read-only.
    #
    # `pull-requests: write` is deliberately NOT granted: days-before-pr-stale and
    # days-before-pr-close are both -1 below, which disables PR handling entirely. Grant
    # it if those ever change.
    permissions:
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          ascending: false
          operations-per-run: 300
          days-before-issue-stale: 90
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'Issue accepted,✋ on hold'
          stale-issue-message: 'This issue is stale because it has been open for 90 days with no activity. If there is no activity in the next 7 days, the issue will be closed.'
          close-issue-message: 'This issue was closed because it has been inactive for 7 days since being marked as stale. Please open a new issue if you believe you are encountering a related problem.'
          days-before-pr-stale: -1
          days-before-pr-close: -1
          enable-statistics: true
