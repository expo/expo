name: AI code review request

# Requesting expo-bot's review starts the AI review. CODEOWNERS requests it for some
# paths, and anyone can re-request it. This workflow only adds the `ai-review` label;
# expo-code-review.yml runs the review on that label, as when a maintainer adds it.
# An outside contributor's fork PR gets the label too, but only when every changed
# file is in the autonomous scope of routing.jsonc. A changeset for a package in the
# scope also counts.
#
# SECURITY: `pull_request_target`. The job checks out only the base branch, for the
# scope script, and runs no PR code.
on:
  pull_request_target:
    types: [review_requested]
    branches: [main, 'sdk-*']

# The label is added with EXPO_BOT_REVIEW_TOKEN, so the `labeled` event starts the
# review workflow. A label added with GITHUB_TOKEN would not.
permissions: {}

concurrency:
  group: ai-code-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      ${{ github.event.requested_reviewer.login == 'expo-bot'
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'ai-review:skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the base branch (never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .expo-agents/code-review/routing.jsonc
          sparse-checkout-cone-mode: false

      # If this step fails, an outsider's PR gets no label.
      - name: Find files in the autonomous review scope
        id: scope
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_REVIEW_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/ai-review-scope.sh

      # A writer can start a review on any PR, as when they add the label by hand.
      # An outsider's fork PR is labeled only inside the autonomous scope, only while
      # the author has fewer than 2 such PRs open, and never twice, so a re-request
      # cannot reset the automatic review limit. A PR keeps `ai-autonomous` after a
      # maintainer removes `ai-review`, so that label marks a PR that already had its turn.
      - name: Add the ai-review label
        env:
          GH_TOKEN: ${{ secrets.EXPO_BOT_REVIEW_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review') }}
          HAS_AUTONOMOUS: ${{ contains(github.event.pull_request.labels.*.name, 'ai-autonomous') }}
          ONLY_AUTONOMOUS: ${{ steps.scope.outputs.only_autonomous }}
          MAX_OPEN: 2
        run: |
          # A collaborator can have read access only, so check the permission itself.
          can_write() {
            case "$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null || true)" in
              admin | maintain | write) return 0 ;;
            esac
            return 1
          }
          # `ai-autonomous` lets a fork PR review again on each push (see expo-code-review.yml).
          # Add it first, so the `ai-review` event already carries it. A fork PR with files
          # outside the scope never gets it: its pushes would only cancel a review.
          add_labels() {
            if [ "$SAME_REPO" != true ] && [ "$ONLY_AUTONOMOUS" = true ]; then
              gh pr edit "$PR" --repo "$REPO" --add-label ai-autonomous
            fi
            gh pr edit "$PR" --repo "$REPO" --add-label ai-review
          }

          if [ "$SAME_REPO" != true ] && ! can_write "$AUTHOR" && ! can_write "$SENDER"; then
            if [ "$HAS_LABEL" = true ] || [ "$HAS_AUTONOMOUS" = true ]; then
              echo "Already reviewed automatically. A maintainer can re-request expo-bot's review to start a new one."
              exit 0
            fi
            if [ "$ONLY_AUTONOMOUS" != true ]; then
              echo "Not starting the AI review: the PR changes files outside the autonomous scope, or they could not be read. A maintainer can add the ai-review label."
              exit 0
            fi
            # The issues API, unlike search, sees a label added a moment ago.
            open=$(gh api -X GET "repos/$REPO/issues" -f state=open -f labels=ai-autonomous \
              -f creator="$AUTHOR" -f per_page=100 \
              --jq "[.[] | select(.pull_request and .number != $PR)] | length") || open=""
            if [ -z "$open" ]; then
              echo "Could not count the author's open PRs. A maintainer can add the ai-review label."
              exit 0
            fi
            if [ "$open" -ge "$MAX_OPEN" ]; then
              echo "Not starting the AI review: $AUTHOR already has $open open PRs with an automatic review. A maintainer can add the ai-review label."
              exit 0
            fi
            add_labels
            exit 0
          fi

          # Re-adding the label starts the review workflow again on a re-request. The
          # removal runs in its own concurrency group, so it cannot cancel the new review.
          if [ "$HAS_LABEL" = true ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label ai-review
          fi
          add_labels
