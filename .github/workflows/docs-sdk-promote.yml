name: Docs SDK Promote

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      sdkVersion:
        description: 'Enter the SDK version'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sdkVersion:
        description: 'Enter the SDK version'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # JS-only job, so skip the ~685 MB @shopify/react-native-skia prebuilt-binary download.
  SKIP_SKIA_DOWNLOAD: '1'
  SDK_VERSION: ${{ inputs.sdkVersion }}

jobs:
  promote:
    if: github.repository == 'expo/expo'
    runs-on: ubuntu-24.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `et generate-bare-diffs` diffs `origin/sdk-NN..origin/main`, so every release branch
          # has to be present. The default shallow single-branch clone has none of them.
          fetch-depth: 0
      - name: 🏗️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - name: ⬢ Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: ♻️ Restore caches
        uses: ./.github/actions/expo-caches
        id: expo-caches
        with:
          pnpm-docs: 'true'
      - name: 📦 Install workspace deps
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: 📦 Install tools deps
        working-directory: tools
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: 📦 Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: ➕ Add `bin` to GITHUB_PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH
      - name: 🛠 Build expotools
        run: pnpm turbo build --filter expotools...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: ⬆️ Promote beta docs to latest
        id: promote
        working-directory: docs
        run: |
          result="$(pnpm --silent sdk-promote --sdk "$SDK_VERSION" | tail -n1)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: 📝 Create Pull Request
        if: ${{ fromJSON(steps.promote.outputs.result).hasChanged }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.EXPO_BOT_GITHUB_TOKEN }}
          branch: bot/docs-sdk-${{ fromJSON(steps.promote.outputs.result).sdkVersion }}-promote
          base: main
          commit-message: ${{ fromJSON(steps.promote.outputs.result).commitMessage }}
          title: ${{ fromJSON(steps.promote.outputs.result).title }}
          body: ${{ fromJSON(steps.promote.outputs.result).body }}
          labels: |
            docs
            preview
          assignees: amandeepmittal
          reviewers: amandeepmittal
          delete-branch: true
          committer: Expo Bot <expo-bot@users.noreply.github.com>
          author: Expo Bot <expo-bot@users.noreply.github.com>
      - name: 🚨 Surface step failures
        if: ${{ fromJSON(steps.promote.outputs.result).failedCount != 0 }}
        run: |
          echo "::error::Some promote steps failed. Check the 'Promote beta docs to latest' step log for details."
          exit 1
      - name: 🔔 Notify on Slack
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.slack_webhook_docs }}
          channel: '#docs'
          author_name: Docs SDK promote
