name: Expotools

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'sdk-*']
    paths: &trigger_paths
      - .github/workflows/expotools.yml
      - tools/**
      - packages/**/spm.config.json
      - packages/**/Package.swift
  pull_request:
    paths: *trigger_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 🔨 Install pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - name: 🔨 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: 📦 Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: ♻️ Restore caches
        uses: ./.github/actions/expo-caches
        id: expo-caches
      - name: 🛠 Compile TypeScript sources
        run: pnpm turbo build --filter expotools...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: expo
      - name: 🛡️ Check SwiftPM manifest collateral
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout uses the PR merge commit; its first parent is the base tip it merged into.
            # pull_request.base.sha can be older, which would count newer base commits as the PR's.
            base=$(git rev-parse HEAD^1)
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            # Compare the whole push; an unavailable force-push baseline fails the gate.
            base="$PUSH_BEFORE_SHA"
          else
            # Manual runs and first pushes compare the whole branch against main.
            base=$(git merge-base origin/main HEAD)
          fi
          node tools/scripts/check-spm-manifest-collateral.cjs --base "$base"
      - name: 🛠 Typecheck sources
        run: pnpm tsc --noEmit
        working-directory: tools
      - name: 🚨 Lint TypeScript sources
        run: pnpm lint --max-warnings 0
        working-directory: tools
      - name: 🧪 Test sources
        run: pnpm test
        working-directory: tools
