name: 'Cache with read-only mode'
description: >
  Runs `actions/cache`, or `actions/cache/restore` when `read-only` is 'true'.
  `actions/cache` can't skip saving the cache at the end of the job, so read-only callers need the restore-only action.

inputs:
  path:
    description: 'Files, directories and wildcard patterns to cache and restore'
    required: true
  key:
    description: 'Key for restoring and saving the cache'
    required: true
  restore-keys:
    description: 'Prefix-matched keys, used for restoring a stale cache if there is no match for `key`'
    required: false
  read-only:
    description: "Set to 'true' to restore the cache without saving it"
    default: 'false'
    required: false

outputs:
  cache-hit:
    description: 'Returns true, if an exact match was found for `key`'
    value: ${{ steps.cache.outputs.cache-hit || steps.cache-read-only.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: ♻️ Restore cache and save it at the end of the job
      if: inputs.read-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - name: ♻️ Restore cache (read-only)
      if: inputs.read-only == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-read-only
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
