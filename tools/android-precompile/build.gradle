buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
  }
  configurations.configureEach {
    resolutionStrategy.force("com.facebook.react:react-android:${providers.gradleProperty('expo.precompileAndroid.reactNativeVersion').get()}")
  }
}

subprojects { project ->
  project.pluginManager.withPlugin("com.android.library") {
    project.afterEvaluate {
      project.android {
        compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
    }
  }
}

apply plugin: "expo-root-project"

// Resolve the same transformed image as javac before independent Gradle builds start.
// Resolving androidJdkImage directly only resolves the input JAR, not the image.
tasks.register("prepareAndroidJdkImage") {
  doLast {
    def javac = project(":expo-modules-core").tasks.named("compileReleaseJavaWithJavac").get()
    def imageInputs = javac.options.compilerArgumentProviders.findAll {
      it instanceof com.android.build.gradle.tasks.JdkImageInput
    }
    if (imageInputs.empty) {
      throw new GradleException("AGP did not configure a JDK image for Android precompilation")
    }
    imageInputs.each { input ->
      logger.lifecycle("Prepared Android JDK image: ${input.asArguments().join(' ')}")
    }
  }
}
