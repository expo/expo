packages:
  - apps/*
  - packages/*
  - packages/@expo/*
  - tools
  - apps/brownfield-tester/expo-app
  - apps/bare-expo/e2e/image-comparison
  - packages/expo-sqlite/dev-plugin-webui

ignoreWorkspaceCycles: true
verifyDepsBeforeRun: warn
linkWorkspacePackages: deep
preferWorkspacePackages: true
resolvePeersFromWorkspaceRoot: true
dedupePeerDependents: true
strictDepBuilds: true
blockExoticSubdeps: true
shellEmulator: true

catalog:
  '@expo/metro': ~58.0.0-rc.0
  '@expo/spawn-async': ^1.8.0
  '@jest/globals': ^29.7.0
  '@playwright/test': ^1.59.0
  '@react-native/jest-preset': 0.88.0-rc.1
  '@testing-library/dom': ^10.4.0
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.0
  '@testing-library/react-native': ^13.3.0
  '@testing-library/user-event': ^14.6.1
  '@types/babel__core': ^7.20.5
  '@types/babel__generator': ^7.27.0
  '@types/cross-spawn': ^6.0.6
  '@types/eslint': ^8.56.12
  '@types/express': ^5.0.3
  '@types/getenv': ^1.0.3
  '@types/jest': ^29.5.12
  '@types/node': ^22.14.0
  '@types/node-forge': ^1.0.0
  '@types/npm-package-arg': ^6.1.0
  '@types/react': ~19.3.0
  '@types/react-dom': ^19.1.7
  '@types/react-test-renderer': ^19.1.0
  '@types/semver': ^7.7.1
  '@types/ws': ^8.5.4
  '@types/xml2js': ~0.4.11
  '@vercel/ncc': ^0.38.4
  arg: ^5.0.2
  debug: ^4.3.4
  eslint8: npm:eslint@^8.57.1
  expect-type: ^1.3.0
  express: ^5.1.0
  getenv: ^2.0.0
  json-schema-to-typescript: ^15.0.0
  memfs: ^3.6.0
  multitars: ^1.0.2
  nock: ^14.0.10
  node-html-parser: ^6.1.5
  npm-run-all2: ^8.0.4
  prettier: ^3.8.3
  react-dom: 19.3.0
  react-native: 0.88.0-rc.1
  react-native-reanimated: 4.6.0
  react-native-worklets: 0.12.2
  react-refresh: ^0.14.2
  react-server-dom-webpack: ~19.0.8
  react-test-renderer: 19.3.0
  resolve-from: ^5.0.0
  resolve-workspace-root: ^2.0.0
  rimraf: ^6.1.2
  terminal-link: ^2.1.1
  update-check: ^1.5.4

loglevel: info

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@expo/*'
  - '@noxcturnal/*'
  - '@react-native/*'
  - 'react-native'
  - multitars
  - noxcturnal

patchedDependencies:
  '@react-native-community/netinfo': patches/@react-native-community+netinfo.patch
  react-native-reanimated: patches/react-native-reanimated.patch
  react-native-worklets: patches/react-native-worklets.patch
  react-server-dom-webpack: patches/react-server-dom-webpack.patch

packageExtensions:
  # NOTE(@kitten): `debug` has an optional peer on `supports-color`. However, depending on
  # where `debug` is installed, which can happen transitively, this may be missing. This
  # then leads to an upward cascade of peers being split into two or more variants
  'debug@*':
    dependencies:
      supports-color: ^8.1.1

allowBuilds:
  '@parcel/watcher': false
  '@shopify/react-native-skia': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: false
  workerd: true
overrides:
  '@types/babel__code-frame': ^7.27.0
  '@types/babel__core': ^7.20.5
  '@types/babel__generator': ^7.27.0
  '@types/babel__template': ^7.4.4
  '@types/babel__traverse': ^7.20.7
  react-native: 0.88.0-rc.1
  react-native-reanimated: 4.6.0
  react-native-worklets: 0.12.2
